rder="154" data-review-value="← All chapters&#10;Chapter 02 · Content revision 1&#10;Prepare text externally, then load it in Rust&#10;Use NVIDIA NeMo Curator to apply a word-count rule, remove repeated text and preserve known source-group splits, then load prepared JSONL in Rust.&#10;In this chapter Explain how source choices, exclusions, duplicates and evaluation overlap affect a training corpus; prepare a bounded example with NeMo Curator and load its selected documents through a caller-supplied Rust reader."></div><div id="practical-02.back-to-index" data-origin-document="practical-02" data-approved-order="155" data-review-value="← All chapters"></div><div id="practical-02.isolated.header.46" data-origin-document="practical-02" data-approved-order="156" data-review-value="Chapter 02 · Content revision 1"></div><div id="practical-02.visible-title" data-origin-document="practical-02" data-approved-order="157" data-review-value="Prepare text externally, then load it in Rust"></div><div id="practical-02.learning-objective-reading" data-origin-document="practical-02" data-approved-order="158" data-review-value="In this chapter Explain how source choices, exclusions, duplicates and evaluation overlap affect a training corpus; prepare a bounded example with NeMo Curator and load its selected documents through a caller-supplied Rust reader."></div><div id="practical-02.learning-objective" data-origin-document="practical-02" data-approved-order="159" data-review-value="In this chapter Explain how source choices, exclusions, duplicates and evaluation overlap affect a training corpus; prepare a bounded example with NeMo Curator and load its selected documents through a caller-supplied Rust reader."></div><div id="practical-02.cheat-sheet-trigger-source-name" data-origin-document="practical-02" data-approved-order="160" data-review-value="Open cheat sheet"></div><div id="practical-02.cheat-sheet-eyebrow-element.0055" data-origin-document="practical-02" data-approved-order="161" data-review-value="Quick reference"></div><div id="practical-02.cheat-sheet-header" data-origin-document="practical-02" data-approved-order="162" data-review-value="Corpus preparation&#10;Terms for selecting training text, handling repeated examples, protecting evaluation roles and reading prepared documents."></div><div id="practical-02.cheat-action-element.0057" data-origin-document="practical-02" data-approved-order="163" data-review-value="Close cheat sheet"></div><div id="practical-02.cheat-status-element.0060" data-origin-document="practical-02" data-approved-order="164" data-review-value="Terms 1–9 of 9; page 1 of 1"></div><div id="practical-02.cheat-sheet-term-01" data-origin-document="practical-02" data-approved-order="165" data-review-value="Decontamination&#10;Check and exclude training overlap with declared protected evaluation material using a specified method. Passing that check does not establish absence of every possible leak."></div><div id="practical-02.cheat-sheet-term-02" data-origin-document="practical-02" data-approved-order="166" data-review-value="Document occurrence&#10;One stored instance of a document. Two records containing the same text are two occurrences and can give that text extra training weight."></div><div id="practical-02.cheat-sheet-term-03" data-origin-document="practical-02" data-approved-order="167" data-review-value="Exact deduplication&#10;Remove repeated text under a declared equality policy. The NeMo example groups text hashes and keeps one representative; it does not detect paraphrases or certify collision-proof equality."></div><div id="practical-02.cheat-sheet-term-04" data-origin-document="practical-02" data-approved-order="168" data-review-value="Held-out split&#10;Validation or test documents kept out of tokenizer learning and model fitting. Validation informs setting choices; test evaluation is reserved for the final assessment."></div><div id="practical-02.cheat-sheet-term-05" data-origin-document="practical-02" data-approved-order="169" data-review-value="Near-duplicate&#10;A document sufficiently similar to another under a declared matching method. Approximate searches can miss related text or group text that should remain distinct."></div><div id="practical-02.cheat-sheet-term-06" data-origin-document="practical-02" data-approved-order="170" data-review-value="Prepared-document interchange&#10;UTF-8 JSONL records with nonblank string id and text fields and retained metadata. Rust loads the supplied selection without redoing filtering, duplicate removal or split assignment."></div><div id="practical-02.cheat-sheet-term-07" data-origin-document="practical-02" data-approved-order="171" data-review-value="Retention fraction&#10;Prepared-document count divided by input-document count for a nonempty input. It measures how much the declared pipeline retains, not the quality of its survivors."></div><div id="practical-02.cheat-sheet-term-08" data-origin-document="practical-02" data-approved-order="172" data-review-value="Source group&#10;Records declared to belong to one related source family. The exercise assigns each supplied group to a single split; that assignment does not prove all related records were discovered."></div><div id="practical-02.cheat-sheet-term-09" data-origin-document="practical-02" data-approved-order="173" data-review-value="Training corpus&#10;The selected documents that supply examples for tokenizer learning and model training, together with evidence of their source and preparation policy."></div><div id="practical-02.section-the-problem-the-model-learns-from-the-text-we-let-through" data-origin-document="practical-02" data-approved-order="174" data-review-value="The problem: the model learns from the text we let through&#10;A language model learns to predict tokens from the documents supplied during training. Its optimizer does not decide whether those documents are appropriate for the task, whether we may use them, or whether a purportedly unseen test example also appears in the training input. Those decisions must happen before training.&#10;Repeated text creates another problem. If one training pass visits every stored document occurrence, each copy of a document supplies another copy of its token targets. The repeated text receives more influence without adding new examples. Removing duplicates changes that weighting; it does not merely save disk space.&#10;Corpus preparation therefore has two outputs: selected text and evidence about how it was selected. We need source context, declared exclusion rules, duplicate handling and protected evaluation boundaries. A large file or a successful download supplies none of those conclusions on its own.&#10;We will use NVIDIA NeMo Curator to prepare text. It is an external tool, not part of the Rust language model, and another preparation tool can replace it if it produces the same documented input for the model. Rust will only load the prepared documents. The extended tokenizer in Chapter 3 will then learn from the training documents, not the validation or test documents."></div><div id="practical-02.heading-the-problem-the-model-learns-from-the-text-we-let-through" data-origin-document="practical-02" data-approved-order="175" data-review-value="The problem: the model learns from the text we let through"></div><div id="practical-02.section-the-solution-prepare-documents-then-load-a-stable-format" data-origin-document="practical-02" data-approved-order="176" data-review-value="The solution: prepare documents, then load a stable format&#10;Keep one document as one record throughout the preparation pipeline. Retain a stable document ID and the source information needed to trace that record. A source record should identify where the text came from, its revision and the applicable license and attribution. A checksum identifies selected bytes; it does not establish permission to use those bytes or tell us what they contain.&#10;Apply declared quality rules, inspect what those rules exclude, and handle duplicates before final training input is frozen. Quality rules are proxies: for example, a minimum word count rejects short records, not every unsuitable record. A rule can also remove useful text. Inspect both survivors and exclusions rather than interpreting a low exclusion rate as success.&#10;Keep privacy review separate from quality scoring. Passing a word-count filter or removing duplicates does not remove names, addresses, credentials or other sensitive content. Withhold unresolved records from training; do not copy their sensitive text into public reports. Retain enough source and transformation information to identify affected derived corpora if an input is withdrawn. Removing a source from a later corpus does not erase what an already trained model may have learned from it.&#10;A six-document example&#10;The practical example uses course-authored text, not a result for a large training corpus. Its JSONL input contains these six documents:&#10;Document ID | Text | Source group | Relevant observation story-a | A cat naps. | family-a | Three words story-b | A cat naps. | family-a | An identical copy of story-a story-c | A dog runs. | family-b | Three words story-d | Rain feeds trees. | family-c | Three words story-e | hi | family-e | One word story-f | !!! | family-f | Punctuation only&#10;Configure NeMo’s word-count filter to retain records with at least 3 and at most 20 words. Its English setting counts whitespace-separated items; that proxy is not a linguistic definition of a word. The 4 story occurrences survive; hi and the punctuation-only record do not. Exact duplicate removal then leaves 3 distinct story texts. The punctuation-only record has one whitespace-separated item too; this particular rule rejects it for length, not because it recognizes punctuation as unsuitable language-model training text. The duplicate-removal workflow may retain either cat-story ID; the result we care about here is one cat-story occurrence, not a promised representative ID or output-file order.&#10;Before deduplication, the cat story occupies 2 of the 4 surviving document occurrences. After deduplication, it occupies 1 of 3 distinct documents. Under uniform sampling of these whole-stage document occurrences before separating their roles, its selection probability would change from 2/4 to 1/3. That calculation illustrates duplicate weighting, not a sampler used to train on this fixture. Actual token-target weighting also depends on document length, split selection and the batching policy; document fractions are not token fractions.&#10;NeMo’s exact method groups hashes of text and identifies copies to remove. It does not identify paraphrases, and hash grouping is not an adversarial collision-proof comparison. NeMo’s fuzzy method uses approximate similarity search for near-duplicates. Its configuration trades missed matches against unwanted matches; it does not certify a universal similarity cutoff or detect all ways an evaluation example could have leaked into training.&#10;Freeze the roles of the prepared documents&#10;The training split supplies examples for fitting the tokenizer and model. The validation split supplies examples for selecting settings or deciding when to stop training. The test split is reserved for final evaluation. Do not move a difficult held-out document into training after seeing its score.&#10;Related records must not be scattered across those roles. Treat an identified duplicate family or other known related source group as one unit when assigning splits. Otherwise two different IDs can put substantially the same example in both training and evaluation. For this fixture, the two cat-story copies share family-a; their different IDs do not make them independent examples.&#10;For the exercise, a supplied policy assigns family-a, family-e and family-f to training, family-b to validation and family-c to test. We fix that policy before running the filters. Both cat-story copies therefore have the same role regardless of which ID duplicate removal keeps. The prepared fixture has one document in each role: the cat story in training, the dog story in validation and the rain story in test.&#10;The recipe uses Pandas to join those declared assignments to the source-group metadata. It refuses an unassigned group rather than choosing a convenient role after seeing the output. This checks the supplied groups, not whether we have discovered every related pair. One held-out story is also far too little evidence for a meaningful model-quality estimate.&#10;Split disjointness and decontamination are different checks. Disjoint IDs do not prove different text. Removing exact duplicates does not prove that near-copies or external benchmark examples are absent. Declare the protected evaluation material and the overlap method before inspecting results, report its measured scope, and keep unresolved overlaps out of training. A check against a named evaluation set does not establish internet-wide contamination freedom.&#10;Export documents, not preparation-specific objects&#10;The handoff to Rust is UTF-8 JSON Lines: one JSON object per physical line. Each object has a nonblank string id and a nonblank string text. Other fields are retained as metadata. For example:&#10;{&quot;id&quot;:&quot;story-c&quot;,&quot;text&quot;:&quot;A dog runs.&quot;,&quot;source_group&quot;:&quot;family-b&quot;}&#10;The document ID is a label, not a token ID or a required filename. The text is still text; tokenization comes next. A newline inside document text must be escaped as \n inside the JSON string, so it does not create a second record. Source and split records remain linked to the exported documents, but a JSONL file alone does not certify that those decisions were made correctly."></div><div id="practical-02.heading-the-solution-prepare-documents-then-load-a-stable-format" data-origin-document="practical-02" data-approved-order="177" data-review-value="The solution: prepare documents, then load a stable format"></div><div id="practical-02.heading-a-six-document-example" data-origin-document="practical-02" data-approved-order="178" data-review-value="A six-document example"></div><div id="practical-02.evidence-table-element.0092" data-origin-document="practical-02" data-approved-order="179" data-review-value="Document ID | Text | Source group | Relevant observation story-a | A cat naps. | family-a | Three words story-b | A cat naps. | family-a | An identical copy of story-a story-c | A dog runs. | family-b | Three words story-d | Rain feeds trees. | family-c | Three words story-e | hi | family-e | One word story-f | !!! | family-f | Punctuation only"></div><div id="practical-02.heading-freeze-the-roles-of-the-prepared-documents" data-origin-document="practical-02" data-approved-order="180" data-review-value="Freeze the roles of the prepared documents"></div><div id="practical-02.heading-export-documents-not-preparation-specific-objects" data-origin-document="practical-02" data-approved-order="181" data-review-value="Export documents, not preparation-specific objects"></div><div id="practical-02.section-formula-distinguish-retention-from-quality" data-origin-document="practical-02" data-approved-order="182" data-review-value="Formula: distinguish retention from quality&#10;For a nonempty input corpus, the final document-retention fraction is&#10;r_{\mathrm{keep}}=\frac{N_{\mathrm{prepared}}}{N_{\mathrm{input}}}&#10;&#10;Here N_{\mathrm{input}} is the number of input document occurrences, N_{\mathrm{prepared}} is the number remaining after the declared preparation stages, and r_{\mathrm{keep}} is a dimensionless fraction. Neither count is a byte count or token count. With zero input documents, the fraction is undefined; report that condition rather than inventing a zero-quality score.&#10;In the six-document example, quality filtering retains 4/6 of the original input. Duplicate removal retains 3/4 of its own input: the four records that reached that stage. Their product is the final retention fraction,&#10;\frac{4}{6}\cdot\frac{3}{4}=\frac{3}{6}=\frac{1}{2}.&#10;&#10;Changing the denominator changes the question. Reporting 1/6 as the duplicate stage’s exclusion fraction would use the original input population rather than the 4 records the duplicate stage examined. Keep every stage’s entering and leaving document counts so its fraction can be interpreted locally.&#10;Keeping half the input says how much remains under this policy. It does not say that half was bad, that the survivors are safe, or that a model trained on them will perform well. Those claims need different evidence."></div><div id="practical-02.heading-formula-distinguish-retention-from-quality" data-origin-document="practical-02" data-approved-order="183" data-review-value="Formula: distinguish retention from quality"></div><div id="practical-02.section-practical-preparation-with-nemo-curator" data-origin-document="practical-02" data-approved-order="184" data-review-value="Practical preparation with NeMo Curator&#10;This workflow uses a separately built NeMo Curator image. You need Linux, Docker, a compatible NVIDIA GPU and driver, and the NVIDIA Container Toolkit so Docker can expose the GPU. The pinned NeMo release must be compatible with that CUDA/driver stack. Rust’s prepared-corpus reader does not require a GPU or CUDA.&#10;Run the following commands from the repository root. The image build may use network access to obtain the external tool. It does not acquire a training corpus or add NeMo to the Rust/site image:&#10;docker build --file docker/nemo-curator.Dockerfile \ --tag learn-llm-nemo-curator:26.07 .&#10;With the NeMo image built and the NVIDIA GPU available to Docker, run from the repository root. Create a fresh output directory for the exercise, then run the tool with network access disabled. The read-only mount supplies the recipe and its six-record fixture; the writable mount receives generated preparation output:&#10;mkdir -p .build/corpus/practical-ch02-exact-fixture docker run --rm --network none --gpus all --memory=8g --cpus=2 --shm-size=1g \ --hostname course-nemo --add-host course-nemo:127.0.0.1 \ --mount type=bind,source=&quot;$PWD/tools/nemo-curator&quot;,target=/course,readonly \ --mount type=bind,source=&quot;$PWD/.build/corpus/practical-ch02-exact-fixture&quot;,target=/output \ learn-llm-nemo-curator:26.07 \ /course/prepare_corpus.py \ --input /course/fixtures/raw.jsonl --output /output \ --split-policy /course/fixtures/splits.json&#10;Use an empty output directory. If the directory already contains an earlier attempt, choose a different directory rather than overwriting its evidence. The hostname mapping lets the local Ray workers resolve their container on loopback; it does not enable external network access.&#10;The recipe invokes NeMo’s reader, configured word-count filter, exact duplicate identification and duplicate-removal workflow. Identification produces IDs to remove; it is not already the prepared text. The removal workflow must consume those IDs from the same input and ID policy, then export the remaining documents.&#10;The filter configuration in tools/nemo-curator/prepare_corpus.py uses the library’s pipeline and stages; the recipe does not implement its own filter:&#10;Pipeline( name=&quot;course_corpus_quality&quot;, stages=[ JsonlReader(file_paths=str(input_path), read_kwargs=read_kwargs), ScoreFilter( filter_obj=WordCountFilter(min_words=min_words, max_words=max_words, lang=&quot;en&quot;), score_field=&quot;word_count&quot;, ), JsonlWriter(path=str(quality_path), mode=&quot;error&quot;), ], ).run(executor=executor)&#10;The surrounding recipe supplies the reader settings, starts a local Ray client, and runs NeMo’s exact-identification and text-removal workflows. The defaults set min_words to 3 and max_words to 20. Command-line options change those values; retain them with the output report when comparing different policies. The supplied split-policy file is independent of the observed scores.&#10;Inspect the generated report and exported files with these commands, still from the repository root:&#10;cat .build/corpus/practical-ch02-exact-fixture/report.json cat .build/corpus/practical-ch02-exact-fixture/prepared.jsonl cat .build/corpus/practical-ch02-exact-fixture/train.jsonl&#10;For this fixture, the expected stage counts are 6 input documents, 4 after word-count filtering and 3 after exact duplicate removal. The final texts are A cat naps., A dog runs. and Rain feeds trees.; do not require one particular cat-story ID. The report also records one document in each role. prepared.jsonl contains all three documents for inspection; train.jsonl, validation.jsonl and test.jsonl contain their respective selections and retain the split metadata.&#10;This is a tiny execution example with a fixed assignment of known source groups. It is not an approval of a larger corpus, a privacy check, proof that all related groups were found or a trained-model result. The helper limits input to 4 MiB and 4096 documents by default so the example is inspectable; those are not a recipe for processing the previously acquired large corpus. A bulk run needs its own feasible configuration and complete selection evidence.&#10;For a real corpus, also retain input provenance, the tool version and configuration, excluded-document counts, the duplicate policy, split assignments and the scope of overlap and privacy review. A successful small fixture does not establish that the same resource settings fit a larger dataset. Select and measure that workload separately, preserving the raw inputs and every failed attempt."></div><div id="practical-02.heading-practical-preparation-with-nemo-curator" data-origin-document="practical-02" data-approved-order="185" data-review-value="Practical preparation with NeMo Curator"></div><div id="practical-02.section-load-the-prepared-output-in-rust" data-origin-document="practical-02" data-approved-order="186" data-review-value="Load the prepared output in Rust&#10;PreparedCorpusReader accepts any caller-supplied BufRead stream. A file, memory buffer or database export can supply that stream without changing the loader. Standard buffered I/O reads physical lines; Serde JSON parses their objects. The loader preserves decoded text and metadata. It does not normalize text, reject duplicate content or assign a split.&#10;The prepared-corpus loader uses Serde JSON to decode required document fields, then rejects blank IDs or text without rewriting their content. rust/crates/llm-from-scratch-practical/src/data/prepared_corpus.rs#prepared-document-json let document: PreparedDocument = serde_json::from_slice(&amp;self.buffer) .map_err(|source| CorpusReadError::InvalidJson { line, source })?; for (field, value) in [(&quot;id&quot;, &amp;document.id), (&quot;text&quot;, &amp;document.text)] { if value.trim().is_empty() { return Err(CorpusReadError::EmptyField { line, field }); } }&#10;The caller chooses maximum source-record bytes, document count and cumulative decoded-text bytes. Record bytes include the physical line ending; decoded text bytes count the UTF-8 representation of the text value, not JSON syntax or metadata. An oversized record, malformed JSON, missing required field, failed read or exceeded limit stops the stream with an error. No failed document is returned or counted. Documents returned earlier are not rolled back.&#10;The prepared-corpus iterator stops after successful end of input or its first error; it never resumes past a failed record. rust/crates/llm-from-scratch-practical/src/data/prepared_corpus.rs#prepared-corpus-stream fn next(&amp;mut self) -&gt; Option&lt;Self::Item&gt; { if self.finished { return None; } match self.read_document() { Ok(Some(document)) =&gt; Some(Ok(document)), Ok(None) =&gt; { self.finished = true; None } Err(error) =&gt; { self.finished = true; Some(Err(error)) } } }&#10;The demo reads standard input, retains only the first three document descriptions for its summary, and emits that summary only after the complete input succeeds. It can therefore inspect a large stream without retaining every text. This is not a transactional storage adapter: a caller storing documents as they arrive must provide its own staging if partial results must stay unpublished.&#10;The Rust demo loads supplied prepared documents, reports their count and decoded text bytes, and does not repeat NeMo's preparation operations. rust/demos/practical-ch02-corpus-preparation/src/lib.rs#load-prepared-corpus pub fn summarize&lt;R: BufRead&gt;( source: R, limits: ReadLimits, ) -&gt; Result&lt;CorpusSummary, CorpusReadError&gt; { let mut documents = PreparedCorpusReader::new(source, limits)?; let mut first_documents = Vec::with_capacity(SUMMARY_DOCUMENTS); for document in documents.by_ref() { let document = document?; if first_documents.len() &lt; SUMMARY_DOCUMENTS { first_documents.push(DocumentSummary { id: document.id, metadata_fields: document.metadata.keys().cloned().collect(), text_utf8_bytes: document.text.len(), }); } // The tokenizer can consume document.text here. This chapter only loads // prepared records; no preparation operation is repeated inside Rust. } Ok(CorpusSummary { first_documents, loaded: documents.progress(), }) }&#10;With Docker running and the Rust workspace image available, load the output from the preceding NeMo command. Run from the repository root:&#10;COURSE_CORPUS=false ./course run cargo run --offline --locked \ -p practical-ch02-corpus-preparation \ &lt; .build/corpus/practical-ch02-exact-fixture/prepared.jsonl&#10;The Rust summary should report 3 loaded documents and 39 decoded text bytes. Those bytes are 11 for the cat story, 11 for the dog story and 17 for the rain story. Metadata and JSON punctuation are not included in that sum. The wrapper runs the Rust program without network access; COURSE_CORPUS=false avoids acquiring the optional large corpus while preparing the Rust image.&#10;With Docker running and the Rust workspace image available, run from the repository root. For the tokenizer’s training input, select the training export created by the NeMo command instead of the all-role inspection file:&#10;COURSE_CORPUS=false ./course run cargo run --offline --locked \ -p practical-ch02-corpus-preparation \ &lt; .build/corpus/practical-ch02-exact-fixture/train.jsonl&#10;This summary reports 1 document and 11 decoded text bytes. Choosing that file is the caller’s responsibility: the loader does not infer a role from a filename or reject held-out records automatically.&#10;The executable receives a corpus through standard input and prints its summary only after the reader reaches successful end of input. rust/demos/practical-ch02-corpus-preparation/src/main.rs#prepared-corpus-example fn main() -&gt; Result&lt;(), Box&lt;dyn std::error::Error&gt;&gt; { // stdin is supplied by the caller: a file redirect, pipe, or other source. // No HTTP, asset path, dataset choice, or GPU is built into this executable. let report = summarize(std::io::stdin().lock(), DEMO_LIMITS)?; println!(&quot;{}&quot;, serde_json::to_string_pretty(&amp;report)?); Ok(()) }"></div><div id="practical-02.heading-load-the-prepared-output-in-rust" data-origin-document="practical-02" data-approved-order="187" data-review-value="Load the prepared output in Rust"></div><div id="practical-02.rust-reading-element.0215" data-origin-document="practical-02" data-approved-order="188" data-review-value="The prepared-corpus loader uses Serde JSON to decode required document fields, then rejects blank IDs or text without rewriting their content. rust/crates/llm-from-scratch-practical/src/data/prepared_corpus.rs#prepared-document-json let document: PreparedDocument = serde_json::from_slice(&amp;self.buffer) .map_err(|source| CorpusReadError::InvalidJson { line, source })?; for (field, value) in [(&quot;id&quot;, &amp;document.id), (&quot;text&quot;, &amp;document.text)] { if value.trim().is_empty() { return Err(CorpusReadError::EmptyField { line, field }); } }"></div><div id="practical-02.rust-caption-element.0215" data-origin-document="practical-02" data-approved-order="189" data-review-value="The prepared-corpus loader uses Serde JSON to decode required document fields, then rejects blank IDs or text without rewriting their content. rust/crates/llm-from-scratch-practical/src/data/prepared_corpus.rs#prepared-document-json"></div><div id="practical-02.rust-accessible-name-element.0215" data-origin-document="practical-02" data-approved-order="190" data-review-value="Rust source: decode one prepared document without curating it"></div><div id="practical-02.rust-reading-element.0219" data-origin-document="practical-02" data-approved-order="191" data-review-value="The prepared-corpus iterator stops after successful end of input or its first error; it never resumes past a failed record. rust/crates/llm-from-scratch-practical/src/data/prepared_corpus.rs#prepared-corpus-stream fn next(&amp;mut self) -&gt; Option&lt;Self::Item&gt; { if self.finished { return None; } match self.read_document() { Ok(Some(document)) =&gt; Some(Ok(document)), Ok(None) =&gt; { self.finished = true; None } Err(error) =&gt; { self.finished = true; Some(Err(error)) } } }"></div><div id="practical-02.rust-caption-element.0219" data-origin-document="practical-02" data-approved-order="192" data-review-value="The prepared-corpus iterator stops after successful end of input or its first error; it never resumes past a failed record. rust/crates/llm-from-scratch-practical/src/data/prepared_corpus.rs#prepared-corpus-stream"></div><div id="practical-02.rust-accessible-name-element.0219" data-origin-document="practical-02" data-approved-order="193" data-review-value="Rust source: stop the prepared-document stream at its error boundary"></div><div id="practical-02.rust-reading-element.0223" data-origin-document="practical-02" data-approved-order="194" data-review-value="The Rust demo loads supplied prepared documents, reports their count and decoded text bytes, and does not repeat NeMo's preparation operations. rust/demos/practical-ch02-corpus-preparation/src/lib.rs#load-prepared-corpus pub fn summarize&lt;R: BufRead&gt;( source: R, limits: ReadLimits, ) -&gt; Result&lt;CorpusSummary, CorpusReadError&gt; { let mut documents = PreparedCorpusReader::new(source, limits)?; let mut first_documents = Vec::with_capacity(SUMMARY_DOCUMENTS); for document in documents.by_ref() { let document = document?; if first_documents.len() &lt; SUMMARY_DOCUMENTS { first_documents.push(DocumentSummary { id: document.id, metadata_fields: document.metadata.keys().cloned().collect(), text_utf8_bytes: document.text.len(), }); } // The tokenizer can consume document.text here. This chapter only loads // prepared records; no preparation operation is repeated inside Rust. } Ok(CorpusSummary { first_documents, loaded: documents.progress(), }) }"></div><div id="practical-02.rust-caption-element.0223" data-origin-document="practical-02" data-approved-order="195" data-review-value="The Rust demo loads supplied prepared documents, reports their count and decoded text bytes, and does not repeat NeMo's preparation operations. rust/demos/practical-ch02-corpus-preparation/src/lib.rs#load-prepared-corpus"></div><div id="practical-02.rust-accessible-name-element.0223" data-origin-document="practical-02" data-approved-order="196" data-review-value="Rust source: summarize a caller-supplied prepared corpus"></div><div id="practical-02.rust-reading-element.0246" data-origin-document="practical-02" data-approved-order="197" data-review-value="The executable receives a corpus through standard input and prints its summary only after the reader reaches successful end of input. rust/demos/practical-ch02-corpus-preparation/src/main.rs#prepared-corpus-example fn main() -&gt; Result&lt;(), Box&lt;dyn std::error::Error&gt;&gt; { // stdin is supplied by the caller: a file redirect, pipe, or other source. // No HTTP, asset path, dataset choice, or GPU is built into this executable. let report = summarize(std::io::stdin().lock(), DEMO_LIMITS)?; println!(&quot;{}&quot;, serde_json::to_string_pretty(&amp;report)?); Ok(()) }"></div><div id="practical-02.rust-caption-element.0246" data-origin-document="practical-02" data-approved-order="198" data-review-value="The executable receives a corpus through standard input and prints its summary only after the reader reaches successful end of input. rust/demos/practical-ch02-corpus-preparation/src/main.rs#prepared-corpus-example"></div><div id="practical-02.rust-accessible-name-element.0246" data-origin-document="practical-02" data-approved-order="199" data-review-value="Rust source: load a prepared-corpus stream supplied by the caller"></div><div id="practical-02.section-history-more-text-was-not-the-whole-solution" data-origin-document="practical-02" data-approved-order="200" data-review-value="History: more text was not the whole solution&#10;Collecting readable text alone does not document its intended use, control the weight of repeated occurrences or protect held-out evaluation from training overlap.&#10;Dataset documentation makes source context reviewable; deduplication studies connect repeated training text with memorization and train-test overlap in their measured settings.&#10;Datasheets for Datasets was first posted in 2018. Gebru and colleagues propose documenting dataset motivation, composition, collection and intended uses so those choices can be reviewed. Documentation records context; it does not itself establish permission or privacy.&#10;The 2021 C4 analysis examined where web-corpus text came from and what filtering removed. Its finding that blocklist filtering disproportionately excluded text from and about minority individuals is a reason to inspect exclusions, not to label every filter neutral.&#10;In 2022, Deduplicating Training Data Makes Language Models Better studied duplicate handling in training corpora. Lee and colleagues report reduced memorized output and train-test overlap after deduplication in their studied corpora and models; those outcomes are not measurements of this course fixture. They explain why duplicate handling and evaluation separation matter in addition to collecting and documenting text.&#10;The following Rust comparison loads two identical supplied records and keeps both. It illustrates the limitation of merely reading raw occurrences, not a reimplementation of those studies’ preparation tools:&#10;Reading two identical JSONL records returns two documents; the loader does not silently perform duplicate removal. rust/crates/llm-from-scratch-practical/src/data/prepared_corpus.rs#loading-is-not-preparation #[test] fn loader_does_not_curate_repeated_ids_or_text() { let source = b&quot;{\&quot;id\&quot;:\&quot;same\&quot;,\&quot;text\&quot;:\&quot;same text\&quot;}\n{\&quot;id\&quot;:\&quot;same\&quot;,\&quot;text\&quot;:\&quot;same text\&quot;}\n&quot;; let documents = PreparedCorpusReader::new(Cursor::new(source), limits()) .unwrap() .collect::&lt;Result&lt;Vec&lt;_&gt;, _&gt;&gt;() .unwrap(); assert_eq!(documents.len(), 2); assert_eq!(documents[0], documents[1]); }&#10;Keep documented source and selection evidence, inspect exclusions, handle related records together and preserve held-out roles before tokenizer learning or model training. No single preparation statistic certifies suitability."></div><div id="practical-02.heading-history-more-text-was-not-the-whole-solution" data-origin-document="practical-02" data-approved-order="201" data-review-value="History: more text was not the whole solution"></div><div id="practical-02.rust-reading-element.0265" data-origin-document="practical-02" data-approved-order="202" data-review-value="Reading two identical JSONL records returns two documents; the loader does not silently perform duplicate removal. rust/crates/llm-from-scratch-practical/src/data/prepared_corpus.rs#loading-is-not-preparation #[test] fn loader_does_not_curate_repeated_ids_or_text() { let source = b&quot;{\&quot;id\&quot;:\&quot;same\&quot;,\&quot;text\&quot;:\&quot;same text\&quot;}\n{\&quot;id\&quot;:\&quot;same\&quot;,\&quot;text\&quot;:\&quot;same text\&quot;}\n&quot;; let documents = PreparedCorpusReader::new(Cursor::new(source), limits()) .unwrap() .collect::&lt;Result&lt;Vec&lt;_&gt;, _&gt;&gt;() .unwrap(); assert_eq!(documents.len(), 2); assert_eq!(documents[0], documents[1]); }"></div><div id="practical-02.rust-caption-element.0265" data-origin-document="practical-02" data-approved-order="203" data-review-value="Reading two identical JSONL records returns two documents; the loader does not silently perform duplicate removal. rust/crates/llm-from-scratch-practical/src/data/prepared_corpus.rs#loading-is-not-preparation"></div><div id="practical-02.rust-accessible-name-element.0265" data-origin-document="practical-02" data-approved-order="204" data-review-value="Rust comparison: loading records does not prepare a corpus"></div><div id="practical-02.section-follow-the-preparation-to-learning-boundary" data-origin-document="practical-02" data-approved-order="205" data-review-value="Follow the preparation-to-learning boundary&#10;Prepare documents outside the Rust language model The six-document course fixture passes through NeMo's word-count rule and exact duplicate removal, leaving three documents. A fixed policy assigns known source groups to training, validation and test; Rust loads the exported records. Document counts count those records. Decoded text bytes measure only the UTF-8 size of their text, excluding metadata. Neither quantity certifies privacy, complete related-source discovery or trained-model quality. 1. Declare the source and policy Keep document IDs, source-group metadata and intended-use context. Freeze quality and split choices before observing their outcomes. Fixture input documents 6 2. Run external NeMo preparation After the word-count rule 4 document occurrences After exact duplicate removal 3 documents Final document-retention fraction \frac{3}{6} The fraction divides the final prepared count by the original input count of 6 documents. One cat-story occurrence remains. Either original cat-story ID may be kept. 3. Export and load the selected role NeMo-prepared JSONL crosses into a caller-supplied Rust reader. Loading validates records and limits, not their suitability for training. All-role inspection export loaded by Rust 3 documents; 39 decoded text bytes Training export loaded by Rust 1 document; 11 decoded text bytes The provided groups keep the three learning roles separate Training 1 fixture document; 11 decoded text bytes. Learn tokenizer choices and fit the model. Validation 1 fixture document; 11 decoded text bytes. Select settings; do not learn tokenizer choices from this text. Test 1 fixture document; 17 decoded text bytes. Reserve for final evaluation; do not fit the model or tokenizer on this text. Only the training export supplies tokenizer learning. Disjoint role labels alone do not prove that near-copies or protected benchmark text are absent.&#10;The preparation tool owns the configured exclusions and duplicate handling. The exported documents and their source and split evidence cross the boundary into the Rust training pipeline. The Rust loader reads that selection; the tokenizer learns only from the training role. Passing a record between stages does not grant it a new quality or privacy guarantee."></div><div id="practical-02.heading-follow-the-preparation-to-learning-boundary" data-origin-document="practical-02" data-approved-order="206" data-review-value="Follow the preparation-to-learning boundary"></div><div id="practical-02.figure-reading-corpus-preparation" data-origin-document="practical-02" data-approved-order="207" data-review-value="Prepare documents outside the Rust language model The six-document course fixture passes through NeMo's word-count rule and exact duplicate removal, leaving three documents. A fixed policy assigns known source groups to training, validation and test; Rust loads the exported records. Document counts count those records. Decoded text bytes measure only the UTF-8 size of their text, excluding metadata. Neither quantity certifies privacy, complete related-source discovery or trained-model quality. 1. Declare the source and policy Keep document IDs, source-group metadata and intended-use context. Freeze quality and split choices before observing their outcomes. Fixture input documents 6 2. Run external NeMo preparation After the word-count rule 4 document occurrences After exact duplicate removal 3 documents Final document-retention fraction \frac{3}{6} The fraction divides the final prepared count by the original input count of 6 documents. One cat-story occurrence remains. Either original cat-story ID may be kept. 3. Export and load the selected role NeMo-prepared JSONL crosses into a caller-supplied Rust reader. Loading validates records and limits, not their suitability for training. All-role inspection export loaded by Rust 3 documents; 39 decoded text bytes Training export loaded by Rust 1 document; 11 decoded text bytes The provided groups keep the three learning roles separate Training 1 fixture document; 11 decoded text bytes. Learn tokenizer choices and fit the model. Validation 1 fixture document; 11 decoded text bytes. Select settings; do not learn tokenizer choices from this text. Test 1 fixture document; 17 decoded text bytes. Reserve for final evaluation; do not fit the model or tokenizer on this text. Only the training export supplies tokenizer learning. Disjoint role labels alone do not prove that near-copies or protected benchmark text are absent."></div><div id="practical-02.figure-name-description-corpus-preparation" data-origin-document="practical-02" data-approved-order="208" data-review-value="Prepare documents outside the Rust language model&#10;The six-document course fixture passes through NeMo's word-count rule and exact duplicate removal, leaving three documents. A fixed policy assigns known source groups to training, validation and test; Rust loads the exported records. Document counts count those records. Decoded text bytes measure only the UTF-8 size of their text, excluding metadata. Neither quantity certifies privacy, complete related-source discovery or trained-model quality."></div><div id="practical-02.figure-card-element.0274" data-origin-document="practical-02" data-approved-order="209" data-review-value="1. Declare the source and policy Keep document IDs, source-group metadata and intended-use context. Freeze quality and split choices before observing their outcomes. Fixture input documents 6"></div><div id="practical-02.figure-contextual-heading-element.0275" data-origin-document="practical-02" data-approved-order="210" data-review-value="1. Declare the source and policy"></div><div id="practical-02.figure-card-element.0280" data-origin-document="practical-02" data-approved-order="211" data-review-value="2. Run external NeMo preparation After the word-count rule 4 document occurrences After exact duplicate removal 3 documents Final document-retention fraction \frac{3}{6} The fraction divides the final prepared count by the original input count of 6 documents. One cat-story occurrence remains. Either original cat-story ID may be kept."></div><div id="practical-02.figure-contextual-heading-element.0281" data-origin-document="practical-02" data-approved-order="212" data-review-value="2. Run external NeMo preparation"></div><div id="practical-02.figure-card-element.0292" data-origin-document="practical-02" data-approved-order="213" data-review-value="3. Export and load the selected role NeMo-prepared JSONL crosses into a caller-supplied Rust reader. Loading validates records and limits, not their suitability for training. All-role inspection export loaded by Rust 3 documents; 39 decoded text bytes Training export loaded by Rust 1 document; 11 decoded text bytes"></div><div id="practical-02.figure-contextual-heading-element.0293" data-origin-document="practical-02" data-approved-order="214" data-review-value="3. Export and load the selected role"></div><div id="practical-02.figure-card-element.0300" data-origin-document="practical-02" data-approved-order="215" data-review-value="The provided groups keep the three learning roles separate Training 1 fixture document; 11 decoded text bytes. Learn tokenizer choices and fit the model. Validation 1 fixture document; 11 decoded text bytes. Select settings; do not learn tokenizer choices from this text. Test 1 fixture document; 17 decoded text bytes. Reserve for final evaluation; do not fit the model or tokenizer on this text. Only the training export supplies tokenizer learning. Disjoint role labels alone do not prove that near-copies or protected benchmark text are absent."></div><div id="practical-02.figure-contextual-heading-element.0301" data-origin-document="practical-02" data-approved-order="216" data-review-value="The provided groups keep the three learning roles separate"></div><div id="practical-02.figure-card-element.0302" data-origin-document="practical-02" data-approved-order="217" data-review-value="Training 1 fixture document; 11 decoded text bytes. Learn tokenizer choices and fit the model."></div><div id="practical-02.figure-contextual-heading-element.0303" data-origin-document="practical-02" data-approved-order="218" data-review-value="Training"></div><div id="practical-02.figure-card-element.0306" data-origin-document="practical-02" data-approved-order="219" data-review-value="Validation 1 fixture document; 11 decoded text bytes. Select settings; do not learn tokenizer choices from this text."></div><div id="practical-02.figure-contextual-heading-element.0307" data-origin-document="practical-02" data-approved-order="220" data-review-value="Validation"></div><div id="practical-02.figure-card-element.0310" data-origin-document="practical-02" data-approved-order="221" data-review-value="Test 1 fixture document; 17 decoded text bytes. Reserve for final evaluation; do not fit the model or tokenizer on this text."></div><div id="practical-02.figure-contextual-heading-element.0311" data-origin-document="practical-02" data-approved-order="222" data-review-value="Test"></div><div id="practical-02.section-optional-practice-reproduce-and-explain-the-boundary" data-origin-document="practical-02" data-approved-order="223" data-review-value="Optional practice: reproduce and explain the boundary&#10;Load the manually prepared fixture with the first command below. Explain why matching its counts to the NeMo output does not identify its producer or establish that its text is suitable for training. Run the malformed-later-input test with the second command. Explain what happens to the success summary and to the document returned before the error.&#10;Run these commands from the repository root with Docker running. The supplied JSONL file is a separate, manually prepared course fixture; it is not a substitute for the preceding NeMo execution.&#10;COURSE_CORPUS=false ./course run cargo run --offline --locked \ -p practical-ch02-corpus-preparation \ &lt; rust/demos/practical-ch02-corpus-preparation/fixtures/prepared.jsonl&#10;This command also prints 3 loaded documents and 39 decoded text bytes. Explain why equal counts do not prove that NeMo produced this file or that its content is suitable for training.&#10;From the repository root, with Docker running and the Rust workspace image available, reproduce the loader’s failure boundary:&#10;COURSE_CORPUS=false ./course run cargo test --offline --locked \ -p practical-ch02-corpus-preparation --lib \ tests::malformed_later_input_has_no_success_summary -- --exact&#10;The test should report running 1 test and 1 passed; 0 failed. It supplies one valid document followed by malformed JSON and confirms that the demo produces no success summary. Zero selected tests means this check did not run.&#10;Explanations for the prepared-corpus loading tasks The manually prepared fixture has its own origin. Matching its document and byte counts to the NeMo example checks only those quantities, not its producer, selection policy, source rights, privacy or split assignment. Keep the actual NeMo input, configuration and output evidence when reproducing that workflow. For malformed later input, the iterator has already returned the earlier valid document before it encounters the error. The demo withholds its final success summary because it consumes the stream completely before printing. A different caller that wrote each returned document immediately would need its own staging to prevent partial publication."></div><div id="practical-02.heading-optional-practice-reproduce-and-explain-the-boundary" data-origin-document="practical-02" data-approved-order="224" data-review-value="Optional practice: reproduce and explain the boundary"></div><div id="practical-02.answers-reading-element.0330" data-origin-document="practical-02" data-approved-order="225" data-review-value="Explanations for the prepared-corpus loading tasks The manually prepared fixture has its own origin. Matching its document and byte counts to the NeMo example checks only those quantities, not its producer, selection policy, source rights, privacy or split assignment. Keep the actual NeMo input, configuration and output evidence when reproducing that workflow. For malformed later input, the iterator has already returned the earlier valid document before it encounters the error. The demo withholds its final success summary because it consumes the stream completely before printing. A different caller that wrote each returned document immediately would need its own staging to prevent partial publication."></div><div id="practical-02.answer-disclosure-element.0331" data-origin-document="practical-02" data-approved-order="226" data-review-value="Explanations for the prepared-corpus loading tasks"></div><div id="practical-02.section-what-reaches-the-language-model-next" data-origin-document="practical-02" data-approved-order="227" data-review-value="What reaches the language model next&#10;Prepared training documents become the tokenizer’s learning input in Chapter 3. Held-out documents may be encoded with the learned tokenizer, but they must not change its learned vocabulary or merge choices. Later batching creates token targets from that same frozen training selection. NeMo has not implemented any of those Rust LLM algorithms; it has supplied documented text for them to learn from."></div><div id="practical-02.heading-what-reaches-the-language-model-next" data-origin-document="practical-02" data-approved-order="228" data-review-value="What reaches the language model next"></div><div id="practical-02.chapter-navigation-reading" data-origin-document="practical-02" data-approved-order="229" data-review-value="← Previous chapter Keep a fixed reference before extending the decoder All chapters Next chapter → Extend BPE with bounded local updates"></div><div id="practical-02.chapter-navigation-group" data-origin-document="practical-02" data-approved-order="230" data-review-value="← Previous chapter Keep a fixed reference before extending the decoder All chapters Next chapter → Extend BPE with bounded local updates"></div><div id="practical-02.chapter-navigation-name" data-origin-document="practical-02" data-approved-order="231" data-review-value="Chapter navigation"></div><div id="practical-02.navigation-link-element.0340" data-origin-document="practical-02" data-approved-order="232" data-review-value="← Previous chapter Keep a fixed reference before extending the decoder"></div><div id="practical-02.navigation-link-element.0341" data-origin-document="practical-02" data-approved-order="233" data-review-value="All chapters"></div><div id="practical-02.navigation-next-ch03" data-origin-document="practical-02" data-approved-order="234" data-review-value="Next chapter → Extend BPE with bounded local updates"></div><div id="practical-02.shared-footer" data-origin-document="practical-02" data-approved-order="235" data-review-value="A static, localized course for understanding language models from the inside."></div><div id="practical-03.source-only-data-diagram-full-view-close" data-origin-document="practical-03" data-approved-order="237" data-review-value="Exit full screen"></div><div id="practical-03.source-only-data-diagram-full-view-open" data-origin-document="practical-03" data-approved-order="238" data-review-value="View diagram full screen"></div><div id="practical-03.seo-description" data-origin-document="practical-03" data-approved-order="239" data-review-value="Extend the existing Rust BPE trainer and tokenizer with bounded local updates, preserve their learned decisions and inspect a chapter-local GPT-2 segmentation example."></div><div id="practical-03.head-title" data-origin-document="practical-03" data-approved-order="240" data-review-value="Extend BPE with bounded local updates · LLM, piece by piece"></div><div id="practical-03.skip-action" data-origin-document="practical-03" data-approved-order="241" data-review-value="Skip to content"></div><div id="practical-03.home-action" data-origin-document="practical-03" data-approved-order="242" data-review-value="LLM, piece by piece&#10;Home"></div><div id="practical-03.language-navigation-name" data-origin-document="practical-03" data-approved-order="243" data-review-value="Language"></div><div id="practical-03.progressive-element.0039" data-origin-document="practical-03" data-approved-order="244" data-review-value="Dark theme"></div><div id="practical-03.lesson-header-reading" data-origin-document="practical-03" data-approved-order="245" data-review-value="← All chapters&#10;Chapter 03 · Content revision 1&#10;Extend BPE with bounded local updates&#10;Extend the existing Rust BPE trainer and tokenizer with bounded local updates, preserve their learned decisions and inspect a chapter-local GPT-2 segmentation example.&#10;In this chapter Extend the existing BPE trainer and tokenizer with bounded prepared-document training and ranked application while preserving training-only input, numeric tie order, leftmost replacement and exact byte reconstruction."></div><div id="practical-03.isolated.header.45" data-origin-document="practical-03" data-approved-order="246" data-review-value="← All chapters"></div><div id="practical-03.isolated.header.46" data-origin-document="practical-03" data-approved-order="247" data-review-value="Chapter 03 · Content revision 1"></div><div id="practical-03.isolated.header.47" data-origin-document="practical-03" data-approved-order="248" data-review-value="Extend BPE with bounded local updates"></div><div id="practical-03.isolated.header.48" data-origin-document="practical-03" data-approved-order="249" data-review-value="Extend the existing Rust BPE trainer and tokenizer with bounded local updates, preserve their learned decisions and inspect a chapter-local GPT-2 segmentation example."></div><div id="practical-03.learning-objective-reading" data-origin-document="practical-03" data-approved-order="250" data-review-value="In this chapter Extend the existing BPE trainer and tokenizer with bounded prepared-document training and ranked application while preserving training-only input, numeric tie order, leftmost replacement and exact byte reconstruction."></div><div id="practical-03.isolated.header.49" data-origin-document="practical-03" data-approved-order="251" data-review-value="In this chapter Extend the existing BPE trainer and tokenizer with bounded prepared-document training and ranked application while preserving training-only input, numeric tie order, leftmost replacement and exact byte reconstruction."></div><div id="practical-03.progressive-element.0052" data-origin-document="practical-03" data-approved-order="252" data-review-value="Open cheat sheet"></div><div id="practical-03.isolated.cheat.eyebrow" data-origin-document="practical-03" data-approved-order="253" data-review-value="Quick reference"></div><div id="practical-03.isolated.cheat.header" data-origin-document="practical-03" data-approved-order="254" data-review-value="BPE decisions and tokenizer policy&#10;Terms for current pair counts, learned ranks, byte reconstruction, pretoken boundaries and tokenizer identity."></div><div id="practical-03.cheat-close-name" data-origin-document="practical-03" data-approved-order="255" data-review-value="Close cheat sheet"></div><div id="practical-03.cheat-page-status" data-origin-document="practical-03" data-approved-order="256" data-review-value="Terms 1–7 of 7; page 1 of 1"></div><div id="practical-03.isolated.term.62" data-origin-document="practical-03" data-approved-order="257" data-review-value="BPE merge&#10;A learned rule that joins two adjacent content tokens. Training selects by current frequency; overlapping occurrences count, but replacements proceed left to right without overlap."></div><div id="practical-03.isolated.term.64" data-origin-document="practical-03" data-approved-order="258" data-review-value="Byte coverage&#10;An initial content token for every possible byte value, so any byte sequence has a fallback encoding. Byte coverage does not imply that each token fragment is valid UTF-8."></div><div id="practical-03.isolated.term.66" data-origin-document="practical-03" data-approved-order="259" data-review-value="Merge rank&#10;A rule's position in the learned order. Encoding prioritizes the earliest learned eligible rule, then the leftmost live occurrence."></div><div id="practical-03.isolated.term.68" data-origin-document="practical-03" data-approved-order="260" data-review-value="Pretokenization&#10;Splitting input into pieces before BPE. Merges stay inside a piece; the chapter's GPT-2 policy example separates a letter from a digit, while the course policy has no internal pretoken boundaries."></div><div id="practical-03.isolated.term.70" data-origin-document="practical-03" data-approved-order="261" data-review-value="Special token&#10;A structural control inserted through an explicit API. The course tokenizer reserves BOS and EOS; ordinary text, including control-looking spellings, cannot insert those IDs."></div><div id="practical-03.isolated.term.72" data-origin-document="practical-03" data-approved-order="262" data-review-value="Tokenizer identity&#10;The exact learned payload and its declared training lineage, including layout, policy and ordered merges. Equal vocabulary sizes or reconstructed text do not identify the same tokenizer."></div><div id="practical-03.isolated.term.74" data-origin-document="practical-03" data-approved-order="263" data-review-value="Tokens per byte&#10;Content-token count divided by input-byte count for nonempty content. The chapter excludes BOS/EOS controls; this sequence-length ratio is not throughput or trained-model quality."></div><div id="practical-03.read.heading.76" data-origin-document="practical-03" data-approved-order="264" data-review-value="The problem: repeated scans must not change learned choices"></div><div id="practical-03.isolated.heading.76" data-origin-document="practical-03" data-approved-order="265" data-review-value="The problem: repeated scans must not change learned choices"></div><div id="practical-03.read.paragraphs.77" data-origin-document="practical-03" data-approved-order="266" data-review-value="Our byte-pair encoding trainer counts adjacent token pairs, selects one pair, replaces its occurrences and repeats. The first course’s Chapter 3 implemented that scalar trainer; Chapter 4 applied its frozen ranks and decoded the resulting tokens. Both are already in the practical course’s starting crate. Here we extend the existing BpeTrainer and BpeTokenizer.&#10;The scalar trainer recounts every current training sequence at every merge rank. With more documents and more requested merges, those repeated scans revisit many edges that have not changed.&#10;We can retain pair statistics and update the edges affected by a replacement. Local updates avoid recounting unaffected edges, but introduce a correctness obligation: the retained counts must describe the current sequences exactly. An old count or an out-of-order replacement can change the learned vocabulary even if the result still decodes to the original bytes.&#10;We will preserve the course’s policy: learn from training documents only, count overlapping adjacent occurrences, break frequency ties by numeric token IDs, and replace matches left to right without sharing an input token between two replacements. A faster implementation of that policy must keep those decisions."></div><div id="practical-03.read.heading.83" data-origin-document="practical-03" data-approved-order="267" data-review-value="Work through two merge ranks"></div><div id="practical-03.isolated.heading.83" data-origin-document="practical-03" data-approved-order="268" data-review-value="Work through two merge ranks"></div><div id="practical-03.read.paragraphs.84" data-origin-document="practical-03" data-approved-order="269" data-review-value="Use two manually prepared training documents, abab and abac. They are separate documents, so the last byte of one never forms a pair with the first byte of the other. The held-out text acac will be encoded after learning; it supplies no pair counts.&#10;Keep the existing public token layout. Program IDs 0 and 1 are BOS and EOS; one-byte content IDs run from 2 through 257. The bytes a, b and c therefore have IDs 99, 100 and 101. The first learned content ID is 258. There is no PAD token. BOS and EOS are structural controls and do not enter training pair counts.&#10;Before rank 0, the current sequences are [99,100,99,100] and [99,100,99,101]. The pair a,b occurs 3 times, b,a occurs 2 times, and a,c occurs once. Select a,b, assign its merged bytes ab the new ID 258, and replace its nonoverlapping occurrences. The sequences become [258,258] and [258,99,101].&#10;Before rank 1, there are only three adjacent occurrences: (258,258), (258,99) and (99,101), each with count 1. Numeric pair order compares the left IDs first. The pair (99,101) wins the tie, so the bytes ac receive ID 259. The two training sequences are now [258,258] and [258,259].&#10;The frozen rules encode held-out acac as [259,259]. Decoding those content tokens reconstructs acac; document framing would instead give [0,259,259,1]. Encoding held-out text applies the learned rules and does not learn another rule."></div><div id="practical-03.read.heading.99" data-origin-document="practical-03" data-approved-order="270" data-review-value="Select from the current counts"></div><div id="practical-03.isolated.heading.99" data-origin-document="practical-03" data-approved-order="271" data-review-value="Select from the current counts"></div><div id="practical-03.read.formula.100" data-origin-document="practical-03" data-approved-order="272" data-review-value="p_t=\min_{\mathrm{lex}}\operatorname*{argmax}_{(a,b)}c_t(a,b)&#10;First collect all pairs having the largest current count. Then choose the numerically smallest pair from that set: smallest left ID, then smallest right ID. If there are no adjacent pairs, learning stops. The prepared-training policy can require an exact merge count. With that policy enabled, training fails if the documents run out of pairs before that count is reached; it does not invent vocabulary entries. Without it, the requested count is an upper limit, as in the original scalar trainer.&#10;t is the zero-based merge rank, counting completed earlier merge rounds. a,b are the left and right content token IDs of an adjacent pair in a current training document. c_t(a,b) is the integer number of adjacent occurrences of that pair in the current training sequences at rank t; overlaps count and document boundaries never contribute. p_t is the selected pair: maximum current count, with ties resolved by the smallest left ID and then the smallest right ID."></div><div id="practical-03.read.heading.104" data-origin-document="practical-03" data-approved-order="273" data-review-value="What the symbols count"></div><div id="practical-03.isolated.heading.104" data-origin-document="practical-03" data-approved-order="274" data-review-value="What the symbols count"></div><div id="practical-03.read.paragraphs.120" data-origin-document="practical-03" data-approved-order="275" data-review-value="For aaa, two overlapping a,a occurrences contribute to the count, but left-to-right replacement consumes the first two bytes together and leaves the third byte alone. That produces one replacement. For aaaa, three occurrences contribute to the count and two nonoverlapping replacements are possible. Frequency and replacement count answer different questions."></div><div id="practical-03.read.heading.121" data-origin-document="practical-03" data-approved-order="276" data-review-value="Keep live edges, then apply learned ranks"></div><div id="practical-03.isolated.heading.121" data-origin-document="practical-03" data-approved-order="277" data-review-value="Keep live edges, then apply learned ranks"></div><div id="practical-03.read.paragraphs.122" data-origin-document="practical-03" data-approved-order="278" data-review-value="BpeTrainer::train_prepared uses Chapter 2’s caller-supplied prepared-corpus reader. The caller supplies the training-only stream, its expected SHA-256 and the identity of the accepted corpus evidence. Training verifies the exact stream bytes and rejects any supplied split metadata that is not train. These checks do not discover overlap or establish rights, privacy or suitability; accepting that preparation evidence remains the caller’s responsibility.&#10;The existing trainer keeps its scalar learning path. The new method adds a bounded working representation behind that same type; it does not define a second tokenizer. The existing BpeTokenizer still owns token layout, frozen rules, vocabulary expansions, document framing and byte decoding."></div><div id="practical-03.read.rust.124" data-origin-document="practical-03" data-approved-order="279" data-review-value="The existing BPE trainer accepts bounded prepared documents and delegates local pair updates to its private working representation. rust/crates/llm-from-scratch-practical/src/tokenizer/bpe_trainer.rs#bounded-prepared-training /// Extend this trainer to bounded, selected prepared documents with local pair updates. pub fn train_prepared&lt;R: std::io::Read&gt;( self, reader: R, read_limits: crate::data::prepared_corpus::ReadLimits, binding: super::policy::TrainingBinding, policy: super::policy::TokenizerPolicy, limits: super::policy::TokenizerLimits, trace: bool, ) -&gt; Result&lt;PreparedBpeTraining, super::policy::TokenizerError&gt; { if self.max_merges != policy.merge_count { return Err(super::policy::TokenizerError::Policy( &quot;trainer and serialized merge budgets differ&quot;, )); } super::incremental::train_prepared(reader, read_limits, binding, policy, limits, trace) }"></div><div id="practical-03.isolated.rust.124" data-origin-document="practical-03" data-approved-order="280" data-review-value="The existing BPE trainer accepts bounded prepared documents and delegates local pair updates to its private working representation. rust/crates/llm-from-scratch-practical/src/tokenizer/bpe_trainer.rs#bounded-prepared-training /// Extend this trainer to bounded, selected prepared documents with local pair updates. pub fn train_prepared&lt;R: std::io::Read&gt;( self, reader: R, read_limits: crate::data::prepared_corpus::ReadLimits, binding: super::policy::TrainingBinding, policy: super::policy::TokenizerPolicy, limits: super::policy::TokenizerLimits, trace: bool, ) -&gt; Result&lt;PreparedBpeTraining, super::policy::TokenizerError&gt; { if self.max_merges != policy.merge_count { return Err(super::policy::TokenizerError::Policy( &quot;trainer and serialized merge budgets differ&quot;, )); } super::incremental::train_prepared(reader, read_limits, binding, policy, limits, trace) }"></div><div id="practical-03.rust-accessible-name-element.0126" data-origin-document="practical-03" data-approved-order="281" data-review-value="Rust source: extend BpeTrainer with prepared-document training"></div><div id="practical-03.read.paragraphs.127" data-origin-document="practical-03" data-approved-order="282" data-review-value="Each ingested byte becomes a token node with stable position, predecessor and successor links. The input text is then released. Consumed nodes retain their arena slots, so the node limit counts every ingested byte position. Node slots and pair indexes stay in memory under caller-selected bounds. Streaming input therefore does not mean constant-memory training or an external-memory algorithm.&#10;A pair index records its current count and ordered live occurrence positions. A priority queue puts the greatest count first, using the smallest numeric pair when counts tie. Count updates can leave old queue entries behind. Each update changes a generation number; a popped entry is usable only if its count and generation still match the current pair state. A queue at its configured capacity is rebuilt from current pairs, preserving the same winner order."></div><div id="practical-03.read.rust.129" data-origin-document="practical-03" data-approved-order="283" data-review-value="Choose the greatest current pair count with the course's numeric tie rule; discard queue entries invalidated by later count updates. rust/crates/llm-from-scratch-practical/src/tokenizer/incremental.rs#incremental-pair-choice fn winner(&amp;mut self) -&gt; Option&lt;(TokenPair, u64)&gt; { while let Some(entry) = self.heap.pop() { let pair = entry.pair.0; if self.pairs.get(&amp;pair).is_some_and(|state| { state.count == entry.count &amp;&amp; state.generation == entry.generation }) { return Some((pair, entry.count)); } } None }"></div><div id="practical-03.isolated.rust.129" data-origin-document="practical-03" data-approved-order="284" data-review-value="
