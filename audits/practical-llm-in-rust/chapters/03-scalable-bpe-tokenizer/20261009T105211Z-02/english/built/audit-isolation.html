quot;)); } let right = self.nodes[left] .next .ok_or(TokenizerError::Invariant(&quot;pair has no right node&quot;))?; let previous = self.nodes[left].previous; let next = self.nodes[right].next; // Three distinct edge starts disappear; adjacent replacements cannot // remove a shared old edge twice because the lists update immediately. if let Some(index) = previous { self.remove_edge(index)?; } self.remove_edge(left)?; self.remove_edge(right)?; self.nodes[left].token = output; self.nodes[left].next = next; self.nodes[right].alive = false; if let Some(index) = next { self.nodes[index].previous = Some(left); } if let Some(index) = previous { self.add_edge(index)?; } self.add_edge(left)?; replacements = replacements .checked_add(self.weights[self.nodes[left].document]) .ok_or(TokenizerError::Overflow)?; } Ok(replacements) }"></div><div id="practical-03.isolated.rust.133" data-origin-document="practical-03" data-approved-order="288" data-review-value="Visit leftmost live matches, remove disappearing edges once and add the new neighboring edges after each replacement. rust/crates/llm-from-scratch-practical/src/tokenizer/incremental.rs#local-edge-replacement fn replace(&amp;mut self, pair: TokenPair, output: u32) -&gt; Result&lt;u64, TokenizerError&gt; { let mut replacements = 0u64; // Stable indices follow source order; first() gives the leftmost live match. while let Some(left) = self .pairs .get(&amp;pair) .and_then(|s| s.occurrences.first()) .copied() { if self.edge(left) != Some(pair) { return Err(TokenizerError::Invariant(&quot;stale live occurrence&quot;)); } let right = self.nodes[left] .next .ok_or(TokenizerError::Invariant(&quot;pair has no right node&quot;))?; let previous = self.nodes[left].previous; let next = self.nodes[right].next; // Three distinct edge starts disappear; adjacent replacements cannot // remove a shared old edge twice because the lists update immediately. if let Some(index) = previous { self.remove_edge(index)?; } self.remove_edge(left)?; self.remove_edge(right)?; self.nodes[left].token = output; self.nodes[left].next = next; self.nodes[right].alive = false; if let Some(index) = next { self.nodes[index].previous = Some(left); } if let Some(index) = previous { self.add_edge(index)?; } self.add_edge(left)?; replacements = replacements .checked_add(self.weights[self.nodes[left].document]) .ok_or(TokenizerError::Overflow)?; } Ok(replacements) }"></div><div id="practical-03.rust-accessible-name-element.0135" data-origin-document="practical-03" data-approved-order="289" data-review-value="Rust source: update live BPE edges during leftmost replacement"></div><div id="practical-03.read.paragraphs.136" data-origin-document="practical-03" data-approved-order="290" data-review-value="The scalar reference reuses the original trainer’s complete learning loop: recount every current sequence, choose the winner and replace left to right. train_byte_fixture supplies the same two byte documents to that loop. The demo adapts its rules and counters into the artifact metadata used by the new path; it does not write another learning loop. Both canonical payloads and their hashes appear in the output, so their agreement can be inspected alongside the different working representations."></div><div id="practical-03.read.rust.137" data-origin-document="practical-03" data-approved-order="291" data-review-value="Adapt the existing scalar trainer's learned rules and counters to the same artifact fields, without using the local pair index. rust/demos/practical-ch03-scalable-bpe-tokenizer/src/lib.rs#scalar-rank-reference fn scalar_fixture( template: &amp;artifact::TokenizerArtifact, documents: &amp;[PreparedDocument], ) -&gt; Result&lt;artifact::TokenizerArtifact, String&gt; { let bytes = documents .iter() .map(|document| document.text.as_bytes().to_vec()) .collect::&lt;Vec&lt;_&gt;&gt;(); let learned = BpeTrainer::new(template.policy.merge_count) .train_byte_fixture(&amp;bytes) .map_err(|error| error.to_string())?; let tokenizer = BpeTokenizer::from_training(&amp;learned).map_err(|error| error.to_string())?; let merges = learned .rules() .iter() .zip(tokenizer.merge_rules()) .map(|(learned, frozen)| { Ok(artifact::ArtifactMerge { candidate_count: u64::try_from(learned.candidate_count()) .map_err(|error| error.to_string())?, left: frozen.content_pair().left(), rank: frozen.rank(), replacements: u64::try_from(learned.replacement_count()) .map_err(|error| error.to_string())?, right: frozen.content_pair().right(), token_id: frozen.content_token_id(), }) }) .collect::&lt;Result&lt;Vec&lt;_&gt;, String&gt;&gt;()?; let count = |lengths: Vec&lt;usize&gt;| -&gt; Result&lt;u64, String&gt; { lengths.into_iter().try_fold(0u64, |total, length| { total .checked_add(u64::try_from(length).map_err(|error| error.to_string())?) .ok_or_else(|| &quot;scalar fixture count overflow&quot;.to_owned()) }) }; let training_documents = u64::try_from(documents.len()).map_err(|error| error.to_string())?; let mut result = template.clone(); result.merges = merges; result.counters = artifact::EfficiencyCounters { content_tokens: count(learned.final_sequences().iter().map(Vec::len).collect())?, control_tokens: training_documents .checked_mul(2) .ok_or(&quot;scalar fixture control count overflow&quot;)?, input_bytes: count(bytes.iter().map(Vec::len).collect())?, training_documents, }; Ok(result) }"></div><div id="practical-03.isolated.rust.137" data-origin-document="practical-03" data-approved-order="292" data-review-value="Adapt the existing scalar trainer's learned rules and counters to the same artifact fields, without using the local pair index. rust/demos/practical-ch03-scalable-bpe-tokenizer/src/lib.rs#scalar-rank-reference fn scalar_fixture( template: &amp;artifact::TokenizerArtifact, documents: &amp;[PreparedDocument], ) -&gt; Result&lt;artifact::TokenizerArtifact, String&gt; { let bytes = documents .iter() .map(|document| document.text.as_bytes().to_vec()) .collect::&lt;Vec&lt;_&gt;&gt;(); let learned = BpeTrainer::new(template.policy.merge_count) .train_byte_fixture(&amp;bytes) .map_err(|error| error.to_string())?; let tokenizer = BpeTokenizer::from_training(&amp;learned).map_err(|error| error.to_string())?; let merges = learned .rules() .iter() .zip(tokenizer.merge_rules()) .map(|(learned, frozen)| { Ok(artifact::ArtifactMerge { candidate_count: u64::try_from(learned.candidate_count()) .map_err(|error| error.to_string())?, left: frozen.content_pair().left(), rank: frozen.rank(), replacements: u64::try_from(learned.replacement_count()) .map_err(|error| error.to_string())?, right: frozen.content_pair().right(), token_id: frozen.content_token_id(), }) }) .collect::&lt;Result&lt;Vec&lt;_&gt;, String&gt;&gt;()?; let count = |lengths: Vec&lt;usize&gt;| -&gt; Result&lt;u64, String&gt; { lengths.into_iter().try_fold(0u64, |total, length| { total .checked_add(u64::try_from(length).map_err(|error| error.to_string())?) .ok_or_else(|| &quot;scalar fixture count overflow&quot;.to_owned()) }) }; let training_documents = u64::try_from(documents.len()).map_err(|error| error.to_string())?; let mut result = template.clone(); result.merges = merges; result.counters = artifact::EfficiencyCounters { content_tokens: count(learned.final_sequences().iter().map(Vec::len).collect())?, control_tokens: training_documents .checked_mul(2) .ok_or(&quot;scalar fixture control count overflow&quot;)?, input_bytes: count(bytes.iter().map(Vec::len).collect())?, training_documents, }; Ok(result) }"></div><div id="practical-03.rust-accessible-name-element.0139" data-origin-document="practical-03" data-approved-order="293" data-review-value="Rust reference: reuse the original BPE trainer's result"></div><div id="practical-03.read.paragraphs.140" data-origin-document="practical-03" data-approved-order="294" data-review-value="Application has a different priority: the earliest learned rank among currently adjacent eligible pairs, followed by the leftmost position. The encoder rechecks adjacency and node versions before using a queued candidate, replaces that pair, and queues its new neighbors. Rules are topological: a merge’s operands already exist before that rule’s output ID is created."></div><div id="practical-03.read.rust.141" data-origin-document="practical-03" data-approved-order="295" data-review-value="Encode content by earliest learned rank and leftmost live position, rejecting stale candidates after neighboring replacements. rust/crates/llm-from-scratch-practical/src/tokenizer/encoding.rs#ranked-live-encoding while let Some(entry) = heap.pop() { let Reverse((rank, left, right, _, _)) = entry; if candidate(&amp;nodes, left, &amp;ranks) != Some(entry) { continue; } let output = tokenizer.merge_rules()[rank].content_token_id(); let previous = nodes[left].previous; let next = nodes[right].next; nodes[left].token = output; nodes[left].next = next; nodes[left].version = nodes[left] .version .checked_add(1) .ok_or(TokenizerError::Overflow)?; nodes[right].alive = false; if let Some(index) = next { nodes[index].previous = Some(left); } if let Some(index) = previous { enqueue(&amp;mut heap, &amp;nodes, index, &amp;ranks, limits)?; } enqueue(&amp;mut heap, &amp;nodes, left, &amp;ranks, limits)?; }"></div><div id="practical-03.isolated.rust.141" data-origin-document="practical-03" data-approved-order="296" data-review-value="Encode content by earliest learned rank and leftmost live position, rejecting stale candidates after neighboring replacements. rust/crates/llm-from-scratch-practical/src/tokenizer/encoding.rs#ranked-live-encoding while let Some(entry) = heap.pop() { let Reverse((rank, left, right, _, _)) = entry; if candidate(&amp;nodes, left, &amp;ranks) != Some(entry) { continue; } let output = tokenizer.merge_rules()[rank].content_token_id(); let previous = nodes[left].previous; let next = nodes[right].next; nodes[left].token = output; nodes[left].next = next; nodes[left].version = nodes[left] .version .checked_add(1) .ok_or(TokenizerError::Overflow)?; nodes[right].alive = false; if let Some(index) = next { nodes[index].previous = Some(left); } if let Some(index) = previous { enqueue(&amp;mut heap, &amp;nodes, index, &amp;ranks, limits)?; } enqueue(&amp;mut heap, &amp;nodes, left, &amp;ranks, limits)?; }"></div><div id="practical-03.rust-accessible-name-element.0143" data-origin-document="practical-03" data-approved-order="297" data-review-value="Rust source: apply learned BPE ranks to live adjacent content"></div><div id="practical-03.read.paragraphs.144" data-origin-document="practical-03" data-approved-order="298" data-review-value="Read chunks are transport boundaries, not token boundaries. encode_reader_bounded reads one whole bounded document before encoding; callers invoke it separately for each document. Literal text such as &lt;|endoftext|&gt; remains content bytes. The existing document-framing operation inserts BOS and EOS after content encoding. Byte decoding is exact; text decoding checks UTF-8 after concatenating all token fragments, since an individual token may contain only part of a UTF-8 character.&#10;max_nodes bounds all ingested training byte positions in one training call, and byte positions in one encoded document. Bounded decoding uses that same numeric limit as the maximum reconstructed content-byte count for one document; it checks the total before allocating the output. A short token sequence can still expand into too many bytes. The existing vocabulary constructor separately bounds each token’s expansion with max_token_bytes and the sum of all content expansions with max_vocabulary_bytes."></div><div id="practical-03.read.heading.146" data-origin-document="practical-03" data-approved-order="299" data-review-value="Preserve the artifact and its evidence boundary"></div><div id="practical-03.isolated.heading.146" data-origin-document="practical-03" data-approved-order="300" data-review-value="Preserve the artifact and its evidence boundary"></div><div id="practical-03.read.paragraphs.147" data-origin-document="practical-03" data-approved-order="301" data-review-value="The tokenizer artifact records its schema and layout, raw-byte policy, training binding, requested merge count, ordered learned rules and efficiency counters. Validation rejects unknown fields or versions, duplicate pairs, gaps, forward operands and inconsistent reduction counts. Vocabulary expansions and output serialization have explicit capacity checks."></div><div id="practical-03.read.rust.148" data-origin-document="practical-03" data-approved-order="302" data-review-value="Validate the learned artifact's metadata, then ask the existing tokenizer to check operands and construct bounded byte expansions. rust/crates/llm-from-scratch-practical/src/tokenizer/artifact.rs#validate-tokenizer-artifact /// Validate metadata, then ask the existing tokenizer to build its vocabulary. pub fn validate(&amp;self, limits: TokenizerLimits) -&gt; Result&lt;BpeTokenizer, TokenizerError&gt; { limits.validate()?; self.policy.validate()?; self.training.validate()?; if self.schema_version != 1 || self.layout_version != TOKENIZER_LAYOUT_VERSION || self.trainer_semantics != &quot;overlapping-count-leftmost-replace-v1&quot; { return Err(TokenizerError::Artifact( &quot;unknown tokenizer format or semantics&quot;, )); } if self.merges.len() &gt; limits.max_nodes { return Err(TokenizerError::Resource( &quot;merge table exceeds working capacity&quot;, )); } if self.merges.len() &gt; self.policy.merge_count || (self.policy.exact_merge_count &amp;&amp; self.merges.len() != self.policy.merge_count) { return Err(TokenizerError::Artifact( &quot;artifact violates requested merge count&quot;, )); } if self.counters.control_tokens != self .counters .training_documents .checked_mul(2) .ok_or(TokenizerError::Overflow)? || self.counters.content_tokens &gt; self.counters.input_bytes { return Err(TokenizerError::Artifact(&quot;inconsistent efficiency counters&quot;)); } let layout = TokenizerLayout::new(self.merges.len())?; let mut pairs = Vec::new(); pairs .try_reserve_exact(self.merges.len()) .map_err(|_| TokenizerError::Resource(&quot;merge operand allocation failed&quot;))?; let mut reduction = 0u64; for (rank, rule) in self.merges.iter().enumerate() { if rule.rank != rank || layout.merge_token_id(rank) != Some(rule.token_id) || rule.replacements == 0 || rule.replacements &gt; rule.candidate_count { return Err(TokenizerError::Artifact(&quot;invalid rank or merge count&quot;)); } let left = rule .left .checked_sub(CONTENT_ID_OFFSET) .ok_or(TokenizerError::Artifact( &quot;control ID cannot be a merge operand&quot;, ))?; let right = rule.right .checked_sub(CONTENT_ID_OFFSET) .ok_or(TokenizerError::Artifact( &quot;control ID cannot be a merge operand&quot;, ))?; pairs.push(TokenPair::new(left, right)); reduction = reduction .checked_add(rule.replacements) .ok_or(TokenizerError::Overflow)?; } if self.counters.input_bytes.checked_sub(reduction) != Some(self.counters.content_tokens) { return Err(TokenizerError::Artifact( &quot;merge reductions disagree with content count&quot;, )); } // This single constructor owns prior-rank operands, duplicate pairs, // byte expansions and their bounds; there is no second vocabulary here. Ok(BpeTokenizer::from_merge_pairs_bounded( &amp;pairs, limits.max_token_bytes, limits.max_vocabulary_bytes, )?) }"></div><div id="practical-03.isolated.rust.148" data-origin-document="practical-03" data-approved-order="303" data-review-value="Validate the learned artifact's metadata, then ask the existing tokenizer to check operands and construct bounded byte expansions. rust/crates/llm-from-scratch-practical/src/tokenizer/artifact.rs#validate-tokenizer-artifact /// Validate metadata, then ask the existing tokenizer to build its vocabulary. pub fn validate(&amp;self, limits: TokenizerLimits) -&gt; Result&lt;BpeTokenizer, TokenizerError&gt; { limits.validate()?; self.policy.validate()?; self.training.validate()?; if self.schema_version != 1 || self.layout_version != TOKENIZER_LAYOUT_VERSION || self.trainer_semantics != &quot;overlapping-count-leftmost-replace-v1&quot; { return Err(TokenizerError::Artifact( &quot;unknown tokenizer format or semantics&quot;, )); } if self.merges.len() &gt; limits.max_nodes { return Err(TokenizerError::Resource( &quot;merge table exceeds working capacity&quot;, )); } if self.merges.len() &gt; self.policy.merge_count || (self.policy.exact_merge_count &amp;&amp; self.merges.len() != self.policy.merge_count) { return Err(TokenizerError::Artifact( &quot;artifact violates requested merge count&quot;, )); } if self.counters.control_tokens != self .counters .training_documents .checked_mul(2) .ok_or(TokenizerError::Overflow)? || self.counters.content_tokens &gt; self.counters.input_bytes { return Err(TokenizerError::Artifact(&quot;inconsistent efficiency counters&quot;)); } let layout = TokenizerLayout::new(self.merges.len())?; let mut pairs = Vec::new(); pairs .try_reserve_exact(self.merges.len()) .map_err(|_| TokenizerError::Resource(&quot;merge operand allocation failed&quot;))?; let mut reduction = 0u64; for (rank, rule) in self.merges.iter().enumerate() { if rule.rank != rank || layout.merge_token_id(rank) != Some(rule.token_id) || rule.replacements == 0 || rule.replacements &gt; rule.candidate_count { return Err(TokenizerError::Artifact(&quot;invalid rank or merge count&quot;)); } let left = rule .left .checked_sub(CONTENT_ID_OFFSET) .ok_or(TokenizerError::Artifact( &quot;control ID cannot be a merge operand&quot;, ))?; let right = rule.right .checked_sub(CONTENT_ID_OFFSET) .ok_or(TokenizerError::Artifact( &quot;control ID cannot be a merge operand&quot;, ))?; pairs.push(TokenPair::new(left, right)); reduction = reduction .checked_add(rule.replacements) .ok_or(TokenizerError::Overflow)?; } if self.counters.input_bytes.checked_sub(reduction) != Some(self.counters.content_tokens) { return Err(TokenizerError::Artifact( &quot;merge reductions disagree with content count&quot;, )); } // This single constructor owns prior-rank operands, duplicate pairs, // byte expansions and their bounds; there is no second vocabulary here. Ok(BpeTokenizer::from_merge_pairs_bounded( &amp;pairs, limits.max_token_bytes, limits.max_vocabulary_bytes, )?) }"></div><div id="practical-03.rust-accessible-name-element.0150" data-origin-document="practical-03" data-approved-order="304" data-review-value="Rust source: validate a learned course BPE artifact"></div><div id="practical-03.read.paragraphs.151" data-origin-document="practical-03" data-approved-order="305" data-review-value="Canonical payload bytes identify the learned tokenizer and its declared training lineage. Producer timestamps, local paths and machine details belong in a separate execution receipt. The two training strategies can emit equal tokenizer payload bytes while having different producer receipts. Equal vocabulary size alone does not identify the rules or their training source.&#10;The fixture finishes with 4 content tokens over 8 input bytes: 4/8=0.5 content tokens per byte. Framing the two training documents adds 4 structural controls, which are excluded from that numerator. This is a sequence-length ratio, not trained-model quality or throughput. Zero input bytes have no tokens-per-byte ratio. Actual memory use and speed on a larger corpus require measurements of that workload; these bounded examples supply no full-corpus result."></div><div id="practical-03.read.command.demo" data-origin-document="practical-03" data-approved-order="306" data-review-value="With Docker running, use the repository’s Rust workspace setup from the repository root. The following command runs the supplied CPU fixtures:&#10;COURSE_CORPUS=false ./course run cargo run --offline --locked \ -p practical-ch03-scalable-bpe-tokenizer&#10;The JSON output includes two merge rounds, held-out content [259,259], equal scalar and incremental payload hashes, content/byte/control counters, storage counters, refusal examples and the separate policy contrast below. It loads no large corpus or model weights."></div><div id="practical-03.read.rust.164" data-origin-document="practical-03" data-approved-order="307" data-review-value="Run the bounded course BPE example and print its complete trace together with the separate chapter-local pretokenization contrast. rust/demos/practical-ch03-scalable-bpe-tokenizer/src/main.rs#scalable-bpe-example fn main() -&gt; Result&lt;(), Box&lt;dyn std::error::Error&gt;&gt; { let output = practical_ch03_scalable_bpe_tokenizer::fixture_output().map_err(std::io::Error::other)?; println!(&quot;{}&quot;, serde_json::to_string_pretty(&amp;output)?); Ok(()) }"></div><div id="practical-03.isolated.rust.164" data-origin-document="practical-03" data-approved-order="308" data-review-value="Run the bounded course BPE example and print its complete trace together with the separate chapter-local pretokenization contrast. rust/demos/practical-ch03-scalable-bpe-tokenizer/src/main.rs#scalable-bpe-example fn main() -&gt; Result&lt;(), Box&lt;dyn std::error::Error&gt;&gt; { let output = practical_ch03_scalable_bpe_tokenizer::fixture_output().map_err(std::io::Error::other)?; println!(&quot;{}&quot;, serde_json::to_string_pretty(&amp;output)?); Ok(()) }"></div><div id="practical-03.rust-accessible-name-element.0166" data-origin-document="practical-03" data-approved-order="309" data-review-value="Rust example: print practical Chapter 3 tokenization evidence"></div><div id="practical-03.read.heading.167" data-origin-document="practical-03" data-approved-order="310" data-review-value="History: subwords still need a boundary policy"></div><div id="practical-03.isolated.heading.167" data-origin-document="practical-03" data-approved-order="311" data-review-value="History: subwords still need a boundary policy"></div><div id="practical-03.read.paragraphs.168" data-origin-document="practical-03" data-approved-order="312" data-review-value="A whole-word vocabulary leaves rare and unseen words difficult to represent; learned subwords reduce that problem, but their alphabet and boundary rules still determine which merges are possible.&#10;In 2016, Neural Machine Translation of Rare Words with Subword Units introduced BPE subword learning for neural translation. Sennrich and colleagues learn subword units by repeatedly merging frequent symbol pairs, with word boundaries retained in their character-based representation. That representation is different from treating a complete document as one raw-byte sequence.&#10;The published GPT-2 encoder applies a reversible byte-to-Unicode mapping, an explicit pretokenization pattern and ranked merges within each resulting piece. The pretokenization boundaries determine where a learned merge can apply. Inspect the pinned encoder implementation. The Unicode symbols represent bytes; the mapping does not normalize the input text."></div><div id="practical-03.read.heading.175" data-origin-document="practical-03" data-approved-order="313" data-review-value="Isolate one letter-digit boundary in Rust"></div><div id="practical-03.isolated.heading.175" data-origin-document="practical-03" data-approved-order="314" data-review-value="Isolate one letter-digit boundary in Rust"></div><div id="practical-03.read.paragraphs.176" data-origin-document="practical-03" data-approved-order="315" data-review-value="Our chapter-local Rust example implements the published byte mapping and pretokenization pattern. It reuses the course tokenizer’s existing frozen-rank engine inside each piece, with one hypothetical merge of a followed by 1. This isolates boundary behavior without implementing BPE again. The demo’s tiny vocabulary defines its displayed IDs; they are not the pretrained GPT-2 vocabulary’s IDs."></div><div id="practical-03.read.rust.177" data-origin-document="practical-03" data-approved-order="316" data-review-value="Map each possible byte to a reversible Unicode symbol and define the chapter's illustrative vocabulary IDs. rust/demos/practical-ch03-scalable-bpe-tokenizer/src/gpt2_contrast.rs#gpt2-byte-mapping let mut byte_order = (b'!'..=b'~') .chain(0xa1..=0xac) .chain(0xae..=0xff) .collect::&lt;Vec&lt;_&gt;&gt;(); let mut symbols = byte_order .iter() .map(|&amp;byte| char::from(byte)) .collect::&lt;Vec&lt;_&gt;&gt;(); let mut next_codepoint = 256u32; for byte in 0..=255u8 { if !byte_order.contains(&amp;byte) { let symbol = char::from_u32(next_codepoint).ok_or(&quot;invalid byte-map symbol&quot;)?; byte_order.push(byte); symbols.push(symbol); next_codepoint += 1; } } let mut bytes = ['\0'; 256]; let mut reverse_bytes = BTreeMap::new(); let mut vocabulary = BTreeMap::new(); for (id, (&amp;byte, &amp;symbol)) in byte_order.iter().zip(&amp;symbols).enumerate() { bytes[byte as usize] = symbol; reverse_bytes.insert(symbol, byte); vocabulary.insert(symbol.to_string(), id as u32); }"></div><div id="practical-03.isolated.rust.177" data-origin-document="practical-03" data-approved-order="317" data-review-value="Map each possible byte to a reversible Unicode symbol and define the chapter's illustrative vocabulary IDs. rust/demos/practical-ch03-scalable-bpe-tokenizer/src/gpt2_contrast.rs#gpt2-byte-mapping let mut byte_order = (b'!'..=b'~') .chain(0xa1..=0xac) .chain(0xae..=0xff) .collect::&lt;Vec&lt;_&gt;&gt;(); let mut symbols = byte_order .iter() .map(|&amp;byte| char::from(byte)) .collect::&lt;Vec&lt;_&gt;&gt;(); let mut next_codepoint = 256u32; for byte in 0..=255u8 { if !byte_order.contains(&amp;byte) { let symbol = char::from_u32(next_codepoint).ok_or(&quot;invalid byte-map symbol&quot;)?; byte_order.push(byte); symbols.push(symbol); next_codepoint += 1; } } let mut bytes = ['\0'; 256]; let mut reverse_bytes = BTreeMap::new(); let mut vocabulary = BTreeMap::new(); for (id, (&amp;byte, &amp;symbol)) in byte_order.iter().zip(&amp;symbols).enumerate() { bytes[byte as usize] = symbol; reverse_bytes.insert(symbol, byte); vocabulary.insert(symbol.to_string(), id as u32); }"></div><div id="practical-03.rust-accessible-name-element.0179" data-origin-document="practical-03" data-approved-order="318" data-review-value="Rust comparison: the published GPT-2 byte-to-Unicode map"></div><div id="practical-03.read.paragraphs.180" data-origin-document="practical-03" data-approved-order="319" data-review-value="The raw-byte fixture learns a1 from a1a1 and encodes a1 as one content token. The published GPT-2 pattern splits a1 into the letter piece a and the digit piece 1 before BPE. The proposed merge cannot cross those pieces, so this policy example emits two content tokens. Both paths reconstruct the same input bytes. Reconstruction therefore does not imply equal segmentation."></div><div id="practical-03.read.rust.181" data-origin-document="practical-03" data-approved-order="320" data-review-value="Split text with the published GPT-2 pattern, reuse the course rank engine inside each piece, and map the resulting fragments to the tiny vocabulary. rust/demos/practical-ch03-scalable-bpe-tokenizer/src/gpt2_contrast.rs#gpt2-pretoken-boundaries for matched in self.pretokenizer.find_iter(text) { let piece = matched.map_err(|error| error.to_string())?.as_str(); pieces.push(piece.to_owned()); for content_id in self.tokenizer.encode_content(piece.as_bytes()) { let expansion = self .tokenizer .token_bytes(content_id) .ok_or(&quot;unknown rank-engine token&quot;)?; let symbols = expansion .iter() .map(|&amp;byte| self.bytes[byte as usize]) .collect::&lt;String&gt;(); token_ids.push( *self .vocabulary .get(&amp;symbols) .ok_or(&quot;missing vocabulary symbol&quot;)?, ); // The published policy reverses the byte map before decoding UTF-8. token_bytes.push( symbols .chars() .map(|symbol| { self.reverse_bytes .get(&amp;symbol) .copied() .ok_or(&quot;unknown byte-map symbol&quot;) }) .collect::&lt;Result&lt;Vec&lt;_&gt;, _&gt;&gt;()?, ); } }"></div><div id="practical-03.isolated.rust.181" data-origin-document="practical-03" data-approved-order="321" data-review-value="Split text with the published GPT-2 pattern, reuse the course rank engine inside each piece, and map the resulting fragments to the tiny vocabulary. rust/demos/practical-ch03-scalable-bpe-tokenizer/src/gpt2_contrast.rs#gpt2-pretoken-boundaries for matched in self.pretokenizer.find_iter(text) { let piece = matched.map_err(|error| error.to_string())?.as_str(); pieces.push(piece.to_owned()); for content_id in self.tokenizer.encode_content(piece.as_bytes()) { let expansion = self .tokenizer .token_bytes(content_id) .ok_or(&quot;unknown rank-engine token&quot;)?; let symbols = expansion .iter() .map(|&amp;byte| self.bytes[byte as usize]) .collect::&lt;String&gt;(); token_ids.push( *self .vocabulary .get(&amp;symbols) .ok_or(&quot;missing vocabulary symbol&quot;)?, ); // The published policy reverses the byte map before decoding UTF-8. token_bytes.push( symbols .chars() .map(|symbol| { self.reverse_bytes .get(&amp;symbol) .copied() .ok_or(&quot;unknown byte-map symbol&quot;) }) .collect::&lt;Result&lt;Vec&lt;_&gt;, _&gt;&gt;()?, ); } }"></div><div id="practical-03.rust-accessible-name-element.0183" data-origin-document="practical-03" data-approved-order="322" data-review-value="Rust comparison: GPT-2 pretokenization restricts eligible BPE merges"></div><div id="practical-03.read.paragraphs.184" data-origin-document="practical-03" data-approved-order="323" data-review-value="The regex engine executes the fixed published pattern; Rust owns the byte map, the existing rank decisions and the illustrative vocabulary IDs. The byte map is reversible and does not create a merge across separate pieces. Here the rank engine works on the pieces’ raw bytes; the resulting byte fragments are then expressed through the map and tiny vocabulary. This demonstrates selected published operations rather than reproducing the pretrained tokenizer. Its bounded results do not establish agreement with every behavior of the original Python regex runtime.&#10;Freeze the training selection and tokenizer policy before constructing decoder token targets. Improve the implementation without changing those learned decisions or confusing byte reconstruction with equal segmentation."></div><div id="practical-03.read.heading.186" data-origin-document="practical-03" data-approved-order="324" data-review-value="Follow the changing counts and the separate boundary example"></div><div id="practical-03.isolated.heading.186" data-origin-document="practical-03" data-approved-order="325" data-review-value="Follow the changing counts and the separate boundary example"></div><div id="practical-03.read.figure.187" data-origin-document="practical-03" data-approved-order="326" data-review-value="Keep BPE choices; compare boundary policies Scalar recounting and incremental edge updates learn ab, then ac from separate abab and abac documents, using numeric tie order. Held-out acac supplies no counts. For input a1 in a separate example, course raw-byte BPE emits one content token. The GPT-2 pattern splits a1 into a and 1, blocking that merge and yielding two content tokens. Both reconstruct a1. The tiny GPT-2 example's IDs are illustrative, not pretrained GPT-2 IDs. Training documents and public IDs abab and abac stay separate. Byte tokens a, b, c use content IDs 99, 100, 101. BOS 0 and EOS 1 are structural controls excluded from pair counts. Select the greatest current count. Break ties by the smallest left ID, then the smallest right ID. Current pairs before rank 0 Current abab/abac pairs after earlier replacements Left content ID | Right content ID | Adjacent occurrences, overlaps counted 99 | 100 | 3 99 | 101 | 1 100 | 99 | 2 Selected pair: (99,100). New content ID: 258. Nonoverlapping replacements: 3. After this rank: abab becomes [258,258]; abac becomes [258,99,101]. Current pairs before rank 1 Current abab/abac pairs after earlier replacements Left content ID | Right content ID | Adjacent occurrences, overlaps counted 99 | 101 | 1 258 | 99 | 1 258 | 258 | 1 Selected pair: (99,101). New content ID: 259. Nonoverlapping replacements: 1. After thi actical-03" data-approved-order="337" data-review-value="Run the overlap test below. Explain why aaa has two counted a,a occurrences but only one replacement. Run the third-rank demo test below. Explain why (258,258) wins the next tie over (258,259) after the main two-rank example. Use the demo command above to inspect gpt2_policy_contrast. Explain why reconstructing a1 in both paths does not imply that both paths emit one token."></div><div id="practical-03.isolated.exercise.286" data-origin-document="practical-03" data-approved-order="338" data-review-value="Run the overlap test below. Explain why aaa has two counted a,a occurrences but only one replacement."></div><div id="practical-03.isolated.exercise.287" data-origin-document="practical-03" data-approved-order="339" data-review-value="Run the third-rank demo test below. Explain why (258,258) wins the next tie over (258,259) after the main two-rank example."></div><div id="practical-03.isolated.exercise.288" data-origin-document="practical-03" data-approved-order="340" data-review-value="Use the demo command above to inspect gpt2_policy_contrast. Explain why reconstructing a1 in both paths does not imply that both paths emit one token."></div><div id="practical-03.read.command.overlap" data-origin-document="practical-03" data-approved-order="341" data-review-value="From the repository root, with Docker running and the Rust workspace setup available, run:&#10;COURSE_CORPUS=false ./course run cargo test --offline --locked \ -p llm-from-scratch-practical --test practical_ch03_tokenizer \ leftmost_overlap -- --exact&#10;Expect running 1 test and 1 passed; 0 failed. This test compares counted overlaps and nonoverlapping replacement sequences using the existing scalar trainer."></div><div id="practical-03.read.command.third-rank" data-origin-document="practical-03" data-approved-order="342" data-review-value="From the same working directory and setup, inspect the checked extra rank:&#10;COURSE_CORPUS=false ./course run cargo test --offline --locked \ -p practical-ch03-scalable-bpe-tokenizer --lib \ tests::optional_third_rank_is_the_checked_course_exercise -- --exact&#10;Expect running 1 test and 1 passed; 0 failed. Zero selected tests means the requested example did not run."></div><div id="practical-03.read.answers.295" data-origin-document="practical-03" data-approved-order="343" data-review-value="Explanations for BPE counts, the third rank and pretoken boundaries For aaa, the two adjacent a,a occurrences start at the first and second positions. Replacing the first occurrence consumes the first two bytes, so the overlapping occurrence cannot also be replaced. The result is one merged aa token followed by the remaining a byte token. After the two learned ranks for separate training documents abab and abac, the current sequences are [258,258] and [258,259], respectively. The remaining pairs (258,258) and (258,259) each have count 1 and left ID 258. Comparing right IDs selects (258,258) because 258 comes before 259. The new ID is 260; abab becomes [260] and abac remains [258,259]. For input a1, byte reconstruction concatenates the token fragments. The course raw-byte path applies its learned a1 merge and emits one content token. The GPT-2 pattern creates separate letter piece a and digit piece 1 before BPE, so that merge cannot cross the pieces and the example emits two content tokens. Both fragment sequences concatenate to the same a1 bytes; equal reconstruction does not imply equal segmentation."></div><div id="practical-03.isolated.answer.summary" data-origin-document="practical-03" data-approved-order="344" data-review-value="Explanations for BPE counts, the third rank and pretoken boundaries"></div><div id="practical-03.isolated.answers" data-origin-document="practical-03" data-approved-order="345" data-review-value="For aaa, the two adjacent a,a occurrences start at the first and second positions. Replacing the first occurrence consumes the first two bytes, so the overlapping occurrence cannot also be replaced. The result is one merged aa token followed by the remaining a byte token. After the two learned ranks for separate training documents abab and abac, the current sequences are [258,258] and [258,259], respectively. The remaining pairs (258,258) and (258,259) each have count 1 and left ID 258. Comparing right IDs selects (258,258) because 258 comes before 259. The new ID is 260; abab becomes [260] and abac remains [258,259]. For input a1, byte reconstruction concatenates the token fragments. The course raw-byte path applies its learned a1 merge and emits one content token. The GPT-2 pattern creates separate letter piece a and digit piece 1 before BPE, so that merge cannot cross the pieces and the example emits two content tokens. Both fragment sequences concatenate to the same a1 bytes; equal reconstruction does not imply equal segmentation."></div><div id="practical-03.read.heading.303" data-origin-document="practical-03" data-approved-order="346" data-review-value="Hand frozen token sequences to batching"></div><div id="practical-03.isolated.heading.303" data-origin-document="practical-03" data-approved-order="347" data-review-value="Hand frozen token sequences to batching"></div><div id="practical-03.read.paragraphs.304" data-origin-document="practical-03" data-approved-order="348" data-review-value="Use the frozen course tokenizer to encode each prepared document separately. Held-out encoding does not fit new merges. Chapter 4 will place those token sequences into variable-length batches without changing tokenizer identity. The embedding and output layers must continue to interpret each content ID according to that same learned vocabulary."></div><div id="practical-03.chapter-navigation-reading" data-origin-document="practical-03" data-approved-order="349" data-review-value="← Previous chapter Prepare text externally, then load it in Rust All chapters"></div><div id="practical-03.chapter-navigation-isolated-group" data-orig
