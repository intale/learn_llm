x" data-approved-order="30" data-review-value="Dark theme"></div><div id="practical-index.index-introduction" data-origin-document="practical-index" data-approved-order="31" data-review-value="The practical course Practical LLM in Rust Extend a separate copy of the completed Rust language model. Chapter 0 explains the structure; Chapter 1 onward introduces practical mechanisms with runnable examples. The index lists available lessons; later chapters remain part of the roadmap."></div><div id="practical-index.visible-title" data-origin-document="practical-index" data-approved-order="32" data-review-value="Practical LLM in Rust"></div><div id="practical-index.ordered-chapter-list" data-origin-document="practical-index" data-approved-order="33" data-review-value="The structure of Practical LLM in Rust Start from the completed Rust language model, follow the practical chapter sequence, and distinguish CPU examples, external corpus preparation and the GPU-backed path. Content revision: 2 Keep a fixed reference before extending the decoder Identify the tiny scalar decoder's fixed inputs and interpret its replay, window-slot scores, checkpoint reload and generated tokens without mistaking them for laptop-scale capability. Content revision: 1 Prepare text externally, then load it in Rust Use NVIDIA NeMo Curator to apply a word-count rule, remove repeated text and preserve known source-group splits, then load prepared JSONL in Rust. Content revision: 1 Extend BPE with bounded local updates Extend the existing Rust BPE trainer and tokenizer with bounded local updates, preserve their learned decisions and inspect a chapter-local GPT-2 segmentation example. Content revision: 1"></div><div id="practical-index.chapter-card-00" data-origin-document="practical-index" data-approved-order="34" data-review-value="00&#10;The structure of Practical LLM in Rust Start from the completed Rust language model, follow the practical chapter sequence, and distinguish CPU examples, external corpus preparation and the GPU-backed path. Content revision: 2"></div><div id="practical-index.chapter-card-01" data-origin-document="practical-index" data-approved-order="35" data-review-value="01&#10;Keep a fixed reference before extending the decoder Identify the tiny scalar decoder's fixed inputs and interpret its replay, window-slot scores, checkpoint reload and generated tokens without mistaking them for laptop-scale capability. Content revision: 1"></div><div id="practical-index.chapter-card-02" data-origin-document="practical-index" data-approved-order="36" data-review-value="02&#10;Prepare text externally, then load it in Rust Use NVIDIA NeMo Curator to apply a word-count rule, remove repeated text and preserve known source-group splits, then load prepared JSONL in Rust. Content revision: 1"></div><div id="practical-index.chapter-card-03" data-origin-document="practical-index" data-approved-order="37" data-review-value="03&#10;Extend BPE with bounded local updates Extend the existing Rust BPE trainer and tokenizer with bounded local updates, preserve their learned decisions and inspect a chapter-local GPT-2 segmentation example. Content revision: 1"></div><div id="practical-index.shared-footer" data-origin-document="practical-index" data-approved-order="38" data-review-value="A static, localized course for understanding language models from the inside."></div><div id="practical-00.seo-description" data-origin-document="practical-00" data-approved-order="40" data-review-value="Start from the completed Rust language model, follow the practical chapter sequence, and distinguish CPU examples, external corpus preparation and the GPU-backed path."></div><div id="practical-00.head-title" data-origin-document="practical-00" data-approved-order="41" data-review-value="The structure of Practical LLM in Rust · LLM, piece by piece"></div><div id="practical-00.shared-action-element.0033" data-origin-document="practical-00" data-approved-order="42" data-review-value="Skip to content"></div><div id="practical-00.shared-action-element.0035" data-origin-document="practical-00" data-approved-order="43" data-review-value="LLM, piece by piece&#10;Home"></div><div id="practical-00.language-navigation-name" data-origin-document="practical-00" data-approved-order="44" data-review-value="Language"></div><div id="practical-00.theme-toggle-source-name" data-origin-document="practical-00" data-approved-order="45" data-review-value="Dark theme"></div><div id="practical-00.lesson-header-reading" data-origin-document="practical-00" data-approved-order="46" data-review-value="← All chapters&#10;Chapter 00 · Content revision 2&#10;The structure of Practical LLM in Rust&#10;Start from the completed Rust language model, follow the practical chapter sequence, and distinguish CPU examples, external corpus preparation and the GPU-backed path.&#10;In this chapter Understand the practical course's starting implementation, prerequisites and chapter sequence, and distinguish small examples from larger measured runs."></div><div id="practical-00.back-to-index" data-origin-document="practical-00" data-approved-order="47" data-review-value="← All chapters"></div><div id="practical-00.isolated.header.46" data-origin-document="practical-00" data-approved-order="48" data-review-value="Chapter 00 · Content revision 2"></div><div id="practical-00.visible-title" data-origin-document="practical-00" data-approved-order="49" data-review-value="The structure of Practical LLM in Rust"></div><div id="practical-00.learning-objective-reading" data-origin-document="practical-00" data-approved-order="50" data-review-value="In this chapter Understand the practical course's starting implementation, prerequisites and chapter sequence, and distinguish small examples from larger measured runs."></div><div id="practical-00.learning-objective" data-origin-document="practical-00" data-approved-order="51" data-review-value="In this chapter Understand the practical course's starting implementation, prerequisites and chapter sequence, and distinguish small examples from larger measured runs."></div><div id="practical-00.section-start-from-a-working-model" data-origin-document="practical-00" data-approved-order="52" data-review-value="Start from a working model&#10;This course starts from a working language model and studies what must change as the data, model and workload grow. The starting implementation is a separate copy of the model completed in LLM from scratch. It already contains byte-pair tokenization, tensors, automatic differentiation, a causal decoder, training, evaluation, checkpoints and cached generation. Here we extend those parts.&#10;Chapter 0 is an orientation. Chapter 1 begins the learning material by recording exactly what the small reference model demonstrates. That record gives later changes a concrete comparison point."></div><div id="practical-00.heading-start-from-a-working-model" data-origin-document="practical-00" data-approved-order="53" data-review-value="Start from a working model"></div><div id="practical-00.section-before-starting" data-origin-document="practical-00" data-approved-order="54" data-review-value="Before starting&#10;Complete LLM from scratch or bring equivalent experience with Rust, byte-pair encoding, causal attention, gradients and next-token training. The first course’s Chapter 39 shows the complete small model. Familiarity with that model matters more than memorizing its chapter numbers.&#10;The initial reference and Rust loading of an already prepared corpus run on a CPU. The GPU-backed practical path requires a compatible NVIDIA GPU. The external corpus-preparation example uses NVIDIA NeMo Curator and needs a GPU and driver compatible with its pinned CUDA/RAPIDS environment. NeMo prepares text outside the Rust model; another tool can supply the same prepared-document format."></div><div id="practical-00.heading-before-starting" data-origin-document="practical-00" data-approved-order="55" data-review-value="Before starting"></div><div id="practical-00.section-keep-the-completed-model-as-the-starting-point" data-origin-document="practical-00" data-approved-order="56" data-review-value="Keep the completed model as the starting point&#10;The first course builds the mechanisms of a small causal language model. This course begins with its completed implementation and studies how data handling, execution, training and inference must change for larger workloads. The Rust implementation for this course lives in rust/crates/llm-from-scratch-practical. Its examples extend that copy; the first course keeps its own implementation."></div><div id="practical-00.heading-keep-the-completed-model-as-the-starting-point" data-origin-document="practical-00" data-approved-order="57" data-review-value="Keep the completed model as the starting point"></div><div id="practical-00.section-follow-the-practical-path" data-origin-document="practical-00" data-approved-order="58" data-review-value="Follow the practical path&#10;Chapter 1: Record the reference model binds the tiny experiment to its inputs and separates repeatable results from claims about language quality or speed. Chapter 2: Prepare a corpus separates external text preparation from Rust loading, and preserves document and split identity. Chapter 3 extends byte-pair encoding. It adds bounded ingestion, local pair updates and efficient application of frozen merge ranks to the existing tokenizer.&#10;The practical course index links to the lessons currently available. The later curriculum continues with variable-length batches and packing, configurable decoder depth and shape, GPU execution, larger training runs, complete resume state, evaluation, adaptation, quantized inference and serving. These are stages of one causal text model. Their examples become available as each mechanism is implemented and measured."></div><div id="practical-00.heading-follow-the-practical-path" data-origin-document="practical-00" data-approved-order="59" data-review-value="Follow the practical path"></div><div id="practical-00.section-read-the-examples-at-their-stated-scale" data-origin-document="practical-00" data-approved-order="60" data-review-value="Read the examples at their stated scale&#10;Small fixtures make intermediate values inspectable: a pair count, a token sequence, a loss or a restored state. They establish the behavior shown for those inputs. They do not establish full-corpus throughput, useful generated language, or a larger model’s memory use. Full-data runs and hardware measurements supply that separate evidence."></div><div id="practical-00.heading-read-the-examples-at-their-stated-scale" data-origin-document="practical-00" data-approved-order="61" data-review-value="Read the examples at their stated scale"></div><div id="practical-00.section-use-the-sequence-to-navigate" data-origin-document="practical-00" data-approved-order="62" data-review-value="Use the sequence to navigate&#10;An ordered chapter list connects each available lesson to its purpose and names the later stages. The individual lessons introduce diagrams where a computation or comparison benefits from one."></div><div id="practical-00.heading-use-the-sequence-to-navigate" data-origin-document="practical-00" data-approved-order="63" data-review-value="Use the sequence to navigate"></div><div id="practical-00.section-continue-with-the-reference-experiment" data-origin-document="practical-00" data-approved-order="64" data-review-value="Continue with the reference experiment&#10;Corpus preparation and tokenization supply the causal decoder’s inputs. Later chapters change how that same model is configured, trained, evaluated and used for generation. Start by establishing the reference experiment in Chapter 1."></div><div id="practical-00.heading-continue-with-the-reference-experiment" data-origin-document="practical-00" data-approved-order="65" data-review-value="Continue with the reference experiment"></div><div id="practical-00.chapter-navigation-reading" data-origin-document="practical-00" data-approved-order="66" data-review-value="All chapters Next chapter → Keep a fixed reference before extending the decoder"></div><div id="practical-00.chapter-navigation-group" data-origin-document="practical-00" data-approved-order="67" data-review-value="All chapters Next chapter → Keep a fixed reference before extending the decoder"></div><div id="practical-00.chapter-navigation-name" data-origin-document="practical-00" data-approved-order="68" data-review-value="Chapter navigation"></div><div id="practical-00.navigation-link-element.0078" data-origin-document="practical-00" data-approved-order="69" data-review-value="All chapters"></div><div id="practical-00.navigation-link-element.0079" data-origin-document="practical-00" data-approved-order="70" data-review-value="Next chapter → Keep a fixed reference before extending the decoder"></div><div id="practical-00.shared-footer" data-origin-document="practical-00" data-approved-order="71" data-review-value="A static, localized course for understanding language models from the inside."></div><div id="practical-01.source-only-data-diagram-full-view-close" data-origin-document="practical-01" data-approved-order="73" data-review-value="Exit full screen"></div><div id="practical-01.source-only-data-diagram-full-view-open" data-origin-document="practical-01" data-approved-order="74" data-review-value="View diagram full screen"></div><div id="practical-01.seo-description" data-origin-document="practical-01" data-approved-order="75" data-review-value="Identify the tiny scalar decoder's fixed inputs and interpret its replay, window-slot scores, checkpoint reload and generated tokens without mistaking them for laptop-scale capability."></div><div id="practical-01.head-title" data-origin-document="practical-01" data-approved-order="76" data-review-value="Keep a fixed reference before extending the decoder · LLM, piece by piece"></div><div id="practical-01.shared-action-element.0033" data-origin-document="practical-01" data-approved-order="77" data-review-value="Skip to content"></div><div id="practical-01.shared-action-element.0035" data-origin-document="practical-01" data-approved-order="78" data-review-value="LLM, piece by piece&#10;Home"></div><div id="practical-01.language-navigation-name" data-origin-document="practical-01" data-approved-order="79" data-review-value="Language"></div><div id="practical-01.theme-toggle-source-name" data-origin-document="practical-01" data-approved-order="80" data-review-value="Dark theme"></div><div id="practical-01.lesson-header-reading" data-origin-document="practical-01" data-approved-order="81" data-review-value="← All chapters&#10;Chapter 01 · Content revision 1&#10;Keep a fixed reference before extending the decoder&#10;Identify the tiny scalar decoder's fixed inputs and interpret its replay, window-slot scores, checkpoint reload and generated tokens without mistaking them for laptop-scale capability.&#10;In this chapter Bind the 1,188-parameter scalar reference to its configuration, fixture and verified source identity, and distinguish its checked regression behavior from unmeasured future capabilities."></div><div id="practical-01.back-to-index" data-origin-document="practical-01" data-approved-order="82" data-review-value="← All chapters"></div><div id="practical-01.isolated.header.46" data-origin-document="practical-01" data-approved-order="83" data-review-value="Chapter 01 · Content revision 1"></div><div id="practical-01.visible-title" data-origin-document="practical-01" data-approved-order="84" data-review-value="Keep a fixed reference before extending the decoder"></div><div id="practical-01.learning-objective-reading" data-origin-document="practical-01" data-approved-order="85" data-review-value="In this chapter Bind the 1,188-parameter scalar reference to its configuration, fixture and verified source identity, and distinguish its checked regression behavior from unmeasured future capabilities."></div><div id="practical-01.learning-objective" data-origin-document="practical-01" data-approved-order="86" data-review-value="In this chapter Bind the 1,188-parameter scalar reference to its configuration, fixture and verified source identity, and distinguish its checked regression behavior from unmeasured future capabilities."></div><div id="practical-01.cheat-sheet-trigger-source-name" data-origin-document="practical-01" data-approved-order="87" data-review-value="Open cheat sheet"></div><div id="practical-01.cheat-sheet-eyebrow-element.0055" data-origin-document="practical-01" data-approved-order="88" data-review-value="Quick reference"></div><div id="practical-01.cheat-sheet-header" data-origin-document="practical-01" data-approved-order="89" data-review-value="The fixed scalar reference&#10;Terms for interpreting the tiny decoder's input identity, regression evidence, replay and checkpoint limits."></div><div id="practical-01.cheat-action-element.0057" data-origin-document="practical-01" data-approved-order="90" data-review-value="Close cheat sheet"></div><div id="practical-01.cheat-status-element.0060" data-origin-document="practical-01" data-approved-order="91" data-review-value="Terms 1–7 of 7; page 1 of 1"></div><div id="practical-01.cheat-sheet-term-01" data-origin-document="practical-01" data-approved-order="92" data-review-value="Bitwise training replay&#10;A separately executed repeat of the same frozen training schedule that matches recorded training behavior and state bit for bit within this execution; it is not an independent seed sample or a measurement of variation across seeds."></div><div id="practical-01.cheat-sheet-term-02" data-origin-document="practical-01" data-approved-order="93" data-review-value="Cached generation agreement&#10;Agreement between the KV-cached and complete-prefix paths on generated tokens, decisions and RNG state for the fixed prompt and sampling settings, not proof of useful language quality."></div><div id="practical-01.cheat-sheet-term-03" data-origin-document="practical-01" data-approved-order="94" data-review-value="Checkpoint round trip&#10;Saving and loading persisted decoder, optimizer and tokenizer state exactly, with a fixed logit probe. This narrow check does not establish complete job resumption."></div><div id="practical-01.cheat-sheet-term-04" data-origin-document="practical-01" data-approved-order="95" data-review-value="Fixed-fixture regression evidence&#10;A known result reproduced on unchanged data to detect changed behavior, rather than an independent estimate of generalization."></div><div id="practical-01.cheat-sheet-term-05" data-origin-document="practical-01" data-approved-order="96" data-review-value="Overlapping window-target slot&#10;One target position inside one causal window. Overlapping windows can score the same within-document transition occurrence repeatedly; this reference scores 1,744 slots representing 442 occurrences."></div><div id="practical-01.cheat-sheet-term-06" data-origin-document="practical-01" data-approved-order="97" data-review-value="Reference input identity&#10;The digest binding the tiny decoder configuration, exact corpus and split bytes, and verified scalar-reference source. It identifies inputs, not model capability."></div><div id="practical-01.cheat-sheet-term-07" data-origin-document="practical-01" data-approved-order="98" data-review-value="Scalar reference decoder&#10;The completed first course's 1,188-parameter CPU decoder, used unchanged as a fixed comparison point while the separate practical copy evolves."></div><div id="practical-01.section-the-problem-changes-need-a-fixed-comparison-point" data-origin-document="practical-01" data-approved-order="99" data-review-value="The problem: changes need a fixed comparison point&#10;The final chapter of LLM from scratch joined the tokenizer, decoder, training, evaluation, checkpoint and generation code. This practical course starts from a separate copy of that implementation. If the data, configuration and code change together, a changed result no longer tells you which version you observed. You need a fixed reference that identifies its inputs and states exactly what its checks establish.&#10;This chapter runs the completed first-course pipeline without modifying it. The practical copy can then evolve while this comparison point stays fixed. The example gives that reference an input identity and a report whose claims stay attached to their evidence. The identity identifies the fixed inputs. The checks establish which behavior this execution reproduced. Neither establishes useful laptop-scale capability.&#10;What the reference actually does&#10;The fixture assigns 8 documents to training, 2 to validation and 2 to test. The decoder has 1188 learned scalar parameters and context capacity 4 tokens. Its primary training schedule and separately executed replay each perform 32 updates on full batches of 16 windows, with 4 valid targets per window. Therefore, each schedule consumes&#10;32\cdot16\cdot4=2048&#10;&#10;valid training targets. One pipeline invocation includes both schedules: 4096 targets altogether. These counts are derived from the frozen full-batch schedule, not from a new runtime token counter. Evaluation targets and generated tokens are separate quantities.&#10;The report’s independent_schedules field counts two separately executed copies of the same schedule from training seed 39, not statistically independent seed samples.&#10;The replay agrees bit for bit with the primary training result in this execution. The selected decoder and frozen bigram then score the same 1744 overlapping test-window target slots. Their mean negative log-likelihoods are approximately 3.866087547 and 3.981342714 nats per slot, respectively. This known comparison is a regression check: rerunning it can expose changes in the checked behavior. It is not an independent estimate of generalization.&#10;There are only 442 within-document transition occurrences in those test documents. Overlapping windows repeat occurrences, so 1744 is not a count of distinct transitions. A separate policy would score each occurrence once, using the longest available causal prefix capped at four tokens and only its newest-position distribution. This run does not report numeric mean NLL or perplexity under that policy.&#10;The checkpoint round trip preserves its encoded bytes, model and optimizer bits, and tokenizer. The restored decoder reproduces logits for the fixed At probe, encoded as token IDs [67,118]. Cached and complete-prefix generation agree on token IDs [260,34,34]: Cyrillic т followed by two spaces. Agreement checks the two generation paths; those three tokens do not demonstrate useful language quality."></div><div id="practical-01.heading-the-problem-changes-need-a-fixed-comparison-point" data-origin-document="practical-01" data-approved-order="100" data-review-value="The problem: changes need a fixed comparison point"></div><div id="practical-01.heading-what-the-reference-actually-does" data-origin-document="practical-01" data-approved-order="101" data-review-value="What the reference actually does"></div><div id="practical-01.section-the-solution-identify-inputs-then-interpret-evidence" data-origin-document="practical-01" data-approved-order="102" data-review-value="The solution: identify inputs, then interpret evidence&#10;R_{\mathrm{ref}}=\operatorname{SHA256}(\mathrm{config}_{1188}\Vert\mathrm{fixture}\Vert\mathrm{source\_revision})&#10;&#10;The identity’s symbols and fixed settings&#10;R_{\mathrm{ref}} is a 256-bit digest, displayed as 64 lowercase hexadecimal characters. Its three named inputs are:&#10;\mathrm{config}_{1188}: a canonical record of eighteen tiny-run settings, together with the invariant that the decoder has 1188 parameters. \mathrm{fixture}: a canonical record of SHA-256 digests of the exact corpus bytes and exact split-manifest bytes. Even a byte change that leaves parsed JSON meaning unchanged creates a different input identity. \mathrm{source\_revision}: a verified source identity combining a baseline revision with the exact forty Rust source files of the completed first-course crate, including its module declarations in lib.rs.&#10;Here \Vert means composition into the shared identity format’s named, canonical fields, not writing three unframed strings beside one another. That distinction matters: without field boundaries, different input sequences can have the same concatenated bytes. The helper orders fields, serializes one unambiguous record and hashes its complete bytes.&#10;The settings fix eight BPE merges; decoder width, feed-forward width and context capacity of four; one attention head and one block; stride one; training and evaluation batch sizes of sixteen and one hundred twenty-eight; thirty-two updates; learning rate 0.04; gradient-norm cap 1; training seed 39; generation seed 38; bigram smoothing 1; generation temperature 0.8; top-k four; and three generated tokens. The identity records floating-point settings by their exact bit patterns rather than rounded display text.&#10;Bind configuration, exact fixture bytes and verified scalar-reference source to one input identity. rust/demos/practical-ch01-reference-core-handoff/src/lib.rs#reference-input-identity /// Bind every tiny-config field, including exact represented floating values. /// The count is the reference decoder's required 1,188-parameter invariant. pub fn tiny_config_identity() -&gt; Result&lt;ArtifactIdentity, IdentityError&gt; { let config = CapstoneConfig::tiny(); let fields = [ (&quot;parameters&quot;, &quot;1188&quot;.to_owned()), (&quot;bpe_merges&quot;, config.bpe_merges().to_string()), (&quot;model_width&quot;, config.model_width().to_string()), (&quot;heads&quot;, config.heads().to_string()), ( &quot;feed_forward_width&quot;, config.feed_forward_width().to_string(), ), (&quot;layers&quot;, config.layers().to_string()), (&quot;context_length&quot;, config.context_length().to_string()), (&quot;window_stride&quot;, config.window_stride().to_string()), (&quot;update_batch_size&quot;, config.update_batch_size().to_string()), ( &quot;evaluation_batch_size&quot;, config.evaluation_batch_size().to_string(), ), (&quot;updates&quot;, config.updates().to_string()), ( &quot;learning_rate_f64_bits&quot;, format!(&quot;{:016x}&quot;, config.learning_rate().to_bits()), ), ( &quot;max_gradient_norm_f64_bits&quot;, format!(&quot;{:016x}&quot;, config.max_gradient_norm().to_bits()), ), (&quot;seed&quot;, config.seed().to_string()), (&quot;generation_seed&quot;, config.generation_seed().to_string()), ( &quot;bigram_alpha_f64_bits&quot;, format!(&quot;{:016x}&quot;, config.bigram_alpha().to_bits()), ), ( &quot;generation_temperature_f64_bits&quot;, format!(&quot;{:016x}&quot;, config.generation_temperature().to_bits()), ), (&quot;generation_top_k&quot;, config.generation_top_k().to_string()), (&quot;generation_tokens&quot;, config.generation_tokens().to_string()), ]; ArtifactIdentity::new( &quot;scalar_reference_config&quot;, fields.iter().map(|(key, value)| (*key, value.as_str())), ) } /// Pure identity construction, also usable by mutation tests without training. /// An identity by itself does not admit alternate inputs to the reference run. pub fn reference_input_identity( config: &amp;ArtifactIdentity, corpus: &amp;[u8], splits: &amp;[u8], source: &amp;ArtifactIdentity, ) -&gt; Result&lt;ArtifactIdentity, IdentityError&gt; { let corpus_digest = sha256(corpus); let splits_digest = sha256(splits); let fixture = ArtifactIdentity::new( &quot;scalar_reference_fixture&quot;, [ (&quot;corpus_sha256&quot;, corpus_digest.as_hex()), (&quot;splits_sha256&quot;, splits_digest.as_hex()), ], )?; let config_bytes = canonical_string(config)?; let fixture_bytes = canonical_string(&amp;fixture)?; let source_bytes = canonical_string(source)?; ArtifactIdentity::new( &quot;scalar_reference_run&quot;, [ (&quot;config_1188&quot;, config_bytes.as_str()), (&quot;fixture&quot;, fixture_bytes.as_str()), (&quot;source_revision&quot;, source_bytes.as_str()), ], ) }&#10;The example verifies its compiled reference-source evidence first. It then rejects changed corpus or split bytes before training or checkpoint work. Only accepted fixed inputs reach the existing pipeline. The wrapper calls that pipeline once; the pipeline itself performs primary training and replay.&#10;Reject changed fixtures, run the unchanged scalar pipeline and retain only its checked observation. rust/demos/practical-ch01-reference-core-handoff/src/lib.rs#reference-handoff /// Refuse changed fixtures before model/checkpoint work, then call the existing /// capstone once. That call already includes primary training and full replay. pub fn run_reference_handoff( corpus_source: &amp;str, split_source: &amp;str, checkpoint_path: impl AsRef&lt;Path&gt;, source: &amp;ReferenceSourceProof, ) -&gt; Result&lt;ReferenceHandoffTrace, ReferenceHandoffError&gt; { if sha256(corpus_source.as_bytes()).as_hex() != CORPUS_SHA256 { return Err(ReferenceHandoffError::FixtureMismatch(&quot;corpus&quot;)); } if sha256(split_source.as_bytes()).as_hex() != SPLITS_SHA256 { return Err(ReferenceHandoffError::FixtureMismatch(&quot;split manifest&quot;)); } // Safe callers obtain this opaque proof only through the foundation's // approved-manifest/compiled-census verification, not a revision string. let identity = reference_input_identity( &amp;tiny_config_identity()?, corpus_source.as_bytes(), split_source.as_bytes(), source.identity(), )?; let digest = identity.digest()?; let observation = run_capstone( corpus_source, split_source, checkpoint_path, CapstoneConfig::tiny(), )?; let evaluation = observation.final_evaluation(); let checkpoint = observation.checkpoint(); if observation.training().parameter_count() != 1188 || observation.training().optimizer_step() != 32 || !observation.training().replay_bitwise() || evaluation.window_count() != 436 || evaluation.window_target_slot_count() != 1744 || evaluation.document_transition_occurrence_count() != 442 || !evaluation.decoder().mean_nll().is_finite() || !evaluation.bigram().mean_nll().is_finite() || !checkpoint.bytes_roundtrip() || !checkpoint.model_bits_exact() || !checkpoint.optimizer_bits_exact() || !checkpoint.tokenizer_exact() || !checkpoint.prompt_logits_bitwise() || !observation.generation().tokens_exact() || !observation.generation().decisions_bitwise() || !observation.generation().rng_state_exact() { return Err(ReferenceHandoffError::Invariant( &quot;scalar reference handoff evidence changed&quot;, )); } Ok(ReferenceHandoffTrace { identity, digest, source_revision: source.source_revision().to_owned(), observation, }) }&#10;What matching identities do not prove&#10;A matching digest identifies the same canonical input record, subject to the hash’s collision-resistance assumption. It does not prove that the algorithm is correct or that a new machine will reproduce every floating-point bit.&#10;The source identity deliberately covers the forty first-course source files, not the evolving practical crate, this chapter’s reporting wrapper or interface. Toolchain, locked dependencies and arithmetic environment are recorded separately. A matching source digest is therefore not evidence that two execution environments match. The temporary checkpoint path is also outside the input identity; changing that path does not change the model’s fixed inputs.&#10;Likewise, exact checkpoint reload is narrower than complete job resumption. This check does not restore every data cursor, in-flight operation or whole-job continuation state. No laptop throughput is measured here."></div><div id="practical-01.heading-the-solution-identify-inputs-then-interpret-evidence" data-origin-document="practical-01" data-approved-order="103" data-review-value="The solution: identify inputs, then interpret evidence"></div><div id="practical-01.heading-the-identitys-symbols-and-fixed-settings" data-origin-document="p config.generation_top_k().to_string()), (&quot;generation_tokens&quot;, config.generation_tokens().to_string()), ]; ArtifactIdentity::new( &quot;scalar_reference_config&quot;, fields.iter().map(|(key, value)| (*key, value.as_str())), ) } /// Pure identity construction, also usable by mutation tests without training. /// An identity by itself does not admit alternate inputs to the reference run. pub fn reference_input_identity( config: &amp;ArtifactIdentity, corpus: &amp;[u8], splits: &amp;[u8], source: &amp;ArtifactIdentity, ) -&gt; Result&lt;ArtifactIdentity, IdentityError&gt; { let corpus_digest = sha256(corpus); let splits_digest = sha256(splits); let fixture = ArtifactIdentity::new( &quot;scalar_reference_fixture&quot;, [ (&quot;corpus_sha256&quot;, corpus_digest.as_hex()), (&quot;splits_sha256&quot;, splits_digest.as_hex()), ], )?; let config_bytes = canonical_string(config)?; let fixture_bytes = canonical_string(&amp;fixture)?; let source_bytes = canonical_string(source)?; ArtifactIdentity::new( &quot;scalar_reference_run&quot;, [ (&quot;config_1188&quot;, config_bytes.as_str()), (&quot;fixture&quot;, fixture_bytes.as_str()), (&quot;source_revision&quot;, source_bytes.as_str()), ], ) }"></div><div id="practical-01.rust-caption-element.0157" data-origin-document="practical-01" data-approved-order="106" data-review-value="Bind configuration, exact fixture bytes and verified scalar-reference source to one input identity. rust/demos/practical-ch01-reference-core-handoff/src/lib.rs#reference-input-identity"></div><div id="practical-01.rust-accessible-name-element.0157" data-origin-document="practical-01" data-approved-order="107" data-review-value="Rust source: canonical scalar-reference input identity"></div><div id="practical-01.rust-reading-element.0161" data-origin-document="practical-01" data-approved-order="108" data-review-value="Reject changed fixtures, run the unchanged scalar pipeline and retain only its checked observation. rust/demos/practical-ch01-refe eference handoff evidence changed&quot;, )); } Ok(ReferenceHandoffTrace { identity, digest, source_revision: source.source_revision().to_owned(), observation, }) }"></div><div id="practical-01.rust-caption-element.0161" data-origin-document="practical-01" data-approved-order="109" data-review-value="Reject changed fixtures, run the unchanged scalar pipeline and retain only its checked observation. rust/demos/practical-ch01-reference-core-handoff/src/lib.rs#reference-handoff"></div><div id="practical-01.rust-accessible-name-element.0161" data-origin-document="practical-01" data-approved-order="110" data-review-value="Rust source: fixed-fixture admission and scalar-reference execution"></div><div id="practical-01.heading-what-matching-identities-do-not-prove" data-origin-document="practical-01" data-approved-order="111" data-review-value="What matching identities do not prove"></div><div id="practical-01.section-history-reporting-conditions-and-measuring-variation" data-origin-document="practical-01" data-approved-order="112" data-review-value="History: reporting conditions and measuring variation&#10;A language-model score without its input conditions and scope does not identify what was evaluated or establish which capabilities were checked.&#10;Model Cards for Model Reporting was presented in 2019. Mitchell and colleagues propose model documentation that includes intended uses and evaluation conditions; a model card is not itself proof of quality.&#10;Model Cards describe evaluation conditions and intended uses; later fine-tuning experiments study variation across initializations and data orders. Reporting scope and measuring variation answer different questions.&#10;In Fine-Tuning Pretrained Language Models: Weight Initializations, Data Orders, and Early Stopping, published in 2020, Dodge and colleagues study fine-tuning variability associated with initialization and data order for pretrained language models. This does not measure variability in the course’s tiny decoder.&#10;Keep a fixed regression reference when changing an LLM pipeline, while recording separately the evidence needed for quality, seed sensitivity and hardware claims.&#10;The Rust reporting contrast uses the same observation. Reading only the mean NLL with this expression gives a number:&#10;trace .observation() .final_evaluation() .decoder() .mean_nll()&#10;trace.report() also states the evaluation unit, input identity, replay accounting and limits. It does not retrain a historical model or execute a seed sweep.&#10;Report the same scalar observation with its metric unit, input identity and explicit capability limits. rust/demos/practical-ch01-reference-core-handoff/src/lib.rs#scope-bearing-report /// Read structured evidence from this one observation; never parse stdout /// or run another model to produce either reporting projection. pub fn report(&amp;self) -&gt; Result&lt;String, ReferenceHandoffError&gt; { let run = &amp;self.observation; let evaluation = run.final_evaluation(); let checkpoint = run.checkpoint(); let generation = run.generation(); let config = CapstoneConfig::tiny(); let targets_per_schedule = config.updates() * config.update_batch_size() * config.context_length(); let record = serde_json::json!({ &quot;schema_version&quot;: 1, &quot;chapter&quot;: &quot;01-reference-core-handoff&quot;, &quot;reference_identity&quot;: self.digest.as_hex(), &quot;source_revision&quot;: self.source_revision, &quot;scope&quot;: &quot;scalar-reference-fixed-fixture-regression&quot;, &quot;documents&quot;: { &quot;train&quot;: run.partitions().train_document_ids().len(), &quot;validation&quot;: run.partitions().validation_document_ids().len(), &quot;test&quot;: run.partitions().test_document_ids().len() }, &quot;model&quot;: { &quot;parameters&quot;: run.training().parameter_count(), &quot;context_tokens&quot;: config.context_length() }, &quot;training&quot;: { &quot;target_count_basis&quot;: &quot;derived-from-frozen-full-batch-schedules&quot;, &quot;updates_per_schedule&quot;: config.updates(), &quot;independent_schedules&quot;: 2, &quot;valid_targets_per_schedule&quot;: targets_per_schedule, &quot;valid_targets_primary_plus_replay&quot;: 2 * targets_per_schedule, &quot;selected_step&quot;: run.training().selected_step(), &quot;within_invocation_replay_bitwise&quot;: run.training().replay_bitwise() }, &quot;evaluation&quot;: { &quot;unit&quot;: &quot;overlapping-window-target-slot&quot;, &quot;windows&quot;: evaluation.window_count(), &quot;window_target_slots&quot;: evaluation.window_target_slot_count(), &quot;document_transition_occurrences&quot;: evaluation.document_transition_occurrence_count(), &quot;transition_multiplicity_counts&quot;: evaluation.transition_multiplicity_counts(), &quot;decoder_mean_nll_nats_per_slot&quot;: evaluation.decoder().mean_nll(), &quot;bigram_mean_nll_nats_per_slot&quot;: evaluation.bigram().mean_nll(), &quot;once_per_transition_metric_reported&quot;: false, &quot;independent_generalization_estimate&quot;: false }, &quot;checkpoint&quot;: { &quot;bytes_roundtrip&quot;: checkpoint.bytes_roundtrip(), &quot;model_bits_exact&quot;: checkpoint.model_bits_exact(), &quot;optimizer_bits_exact&quot;: checkpoint.optimizer_bits_exact(), &quot;tokenizer_exact&quot;: checkpoint.tokenizer_exact(), &quot;logit_probe_text&quot;: checkpoint.logit_probe_text(), &quot;logit_probe_ids&quot;: checkpoint.logit_probe_ids(), &quot;probe_logits_bitwise&quot;: checkpoint.prompt_logits_bitwise(), &quot;complete_job_resume_established&quot;: false }, &quot;generation&quot;: { &quot;prompt&quot;: generation.prompt_text(), &quot;token_ids&quot;: generation.generated_ids(), &quot;decoded_text&quot;: generation.decoded_text(), &quot;cached_reference_tokens_exact&quot;: generation.tokens_exact(), &quot;cached_reference_decisions_bitwise&quot;: generation.decisions_bitwise(), &quot;cached_reference_rng_exact&quot;: generation.rng_state_exact(), &quot;useful_language_quality_established&quot;: false }, &quot;laptop_throughput_measured&quot;: false, &quot;successor_chapter&quot;: SUCCESSOR_CHAPTER }); let mut text = serde_json::to_string_pretty(&amp;record) .map_err(|_| ReferenceHandoffError::Serialization)?; text.push('\n'); Ok(text) }&#10;Repeating seed 39 checks repeatability under fixed conditions. It does not estimate variability across seeds. Those are complementary checks, not interchangeable evidence."></div><div id="practical-01.heading-history-reporting-conditions-and-measuring-variation" data-origin-document="practical-01" data-approved-order="113" data-review-value="History: reporting conditions and measuring variation"></div><div id="practical-01.rust-reading-element.0179" data-origin-document="practical-01" data-approved-order="114" data-review-value="Report the same scalar observation with its metric unit, input identity and explicit capability limits. rust/demos/practical-ch01-reference-core-handoff/src/lib.rs#scope-bearing-report /// Read structured evidence from this one observation; never parse stdout /// or run another model to produce either reporting projection. pub fn report(&amp;self) -&gt; Result&lt;String, ReferenceHandoffError&gt; { let run = &amp;self.observation; let evaluation = run.final_evaluation(); let checkpoint = run.checkpoint(); let generation = run.generation(); let config = CapstoneConfig::tiny(); let targets_per_schedule = config.updates() * config.update_batch_size() * config.context_length(); let record = serde_json::json!({ &quot;schema_version&quot;: 1, &quot;chapter&quot;: &quot;01-reference-core-handoff&quot;, &quot;reference_identity&quot;: self.digest.as_hex(), &quot;source_revision&quot;: self.source_revision, &quot;scope&quot;: &quot;scalar-reference-fixed-fixture-regression&quot;, &quot;documents&quot;: { &quot;train&quot;: run.partitions().train_document_ids().len(), &quot;validation&quot;: run.partitions().validation_document_ids().len(), &quot;test&quot;: run.partitions().test_document_ids().len() }, &quot;model&quot;: { &quot;parameters&quot;: run.training().parameter_count(), &quot;context_tokens&quot;: config.context_length() }, &quot;training&quot;: { &quot;target_count_basis&quot;: &quot;derived-from-frozen-full-batch-schedules&quot;, &quot;updates_per_schedule&quot;: config.updates(), &quot;independent_schedules&quot;: 2, &quot;valid_targets_per_schedule&quot;: targets_per_schedule, &quot;valid_targets_primary_plus_replay&quot;: 2 * targets_per_schedule, &quot;selected_step&quot;: run.training().selected_step(), &quot;within_invocation_replay_bitwise&quot;: run.training().replay_bitwise() }, &quot;evaluation&quot;: { &quot;unit&quot;: &quot;overlapping-window-target-slot&quot;, &quot;windows&quot;: evaluation.window_count(), &quot;window_target_slots&quot;: evaluation.window_target_slot_count(), &quot;document_transition_occurrences&quot;: evaluation.document_transition_occurrence_count(), &quot;transition_multiplicity_counts&quot;: evaluation.transition_multiplicity_counts(), &quot;decoder_mean_nll_nats_per_slot&quot;: evaluation.decoder().mean_nll(), &quot;bigram_mean_nll_nats_per_slot&quot;: evaluation.bigram().mean_nll(), &quot;once_per_transition_metric_reported&quot;: false, &quot;independent_generalization_estimate&quot;: false }, &quot;checkpoint&quot;: { &quot;bytes_roundtrip&quot;: checkpoint.bytes_roundtrip(), &quot;model_bits_exact&quot;: checkpoint.model_bits_exact(), &quot;optimizer_bits_exact&quot;: checkpoint.optimizer_bits_exact(), &quot;tokenizer_exact&quot;: checkpoint.tokenizer_exact(), &quot;logit_probe_text&quot;: checkpoint.logit_probe_text(), &quot;logit_probe_ids&quot;: checkpoint.logit_probe_ids(), &quot;probe_logits_bitwise&quot;: checkpoint.prompt_logits_bitwise(), &quot;complete_job_resume_established&quot;: false }, &quot;generation&quot;: { &quot;prompt&quot;: generation.prompt_text(), &quot;token_ids&quot;: generation.generated_ids(), &quot;decoded_text&quot;: generation.decoded_text(), &quot;cached_reference_tokens_exact&quot;: generation.tokens_exact(), &quot;cached_reference_decisions_bitwise&quot;: generation.decisions_bitwise(), &quot;cached_reference_rng_exact&quot;: generation.rng_state_exact(), &quot;useful_language_quality_established&quot;: false }, &quot;laptop_throughput_measured&quot;: false, &quot;successor_chapter&quot;: SUCCESSOR_CHAPTER }); let mut text = serde_json::to_string_pretty(&amp;record) .map_err(|_| ReferenceHandoffError::Serialization)?; text.push('\n'); Ok(text) }"></div><div id="practical-01.rust-caption-element.0179" data-origin-document="practical-01" data-approved-order="115" data-review-value="Report the same scalar observation with its metric unit, input identity and explicit capability limits. rust/demos/practical-ch01-reference-core-handoff/src/lib.rs#scope-bearing-report"></div><div id="practical-01.rust-accessible-name-element.0179" data-origin-document="practical-01" data-approved-order="116" data-review-value="Rust source: scope-bearing scalar-reference report"></div><div id="practical-01.section-run-the-reference-without-changing-its-inputs" data-origin-document="practical-01" data-approved-order="117" data-review-value="Run the reference without changing its inputs&#10;The example obtains verified source evidence and owns its temporary checkpoint location. Its report comes directly from the checked scalar observation, not from parsing a previous human-readable report.&#10;Verify the reference source, use an owned temporary checkpoint and print the scope-bearing report. rust/demos/practical-ch01-reference-core-handoff/src/main.rs#reference-example fn main() -&gt; Result&lt;(), Box&lt;dyn Error&gt;&gt; { let source = verify_compiled_reference_source()?; let checkpoint = OwnedCheckpoint::new()?; let trace = run_reference_handoff(CORPUS, SPLITS, &amp;checkpoint.file, &amp;source)?; print!(&quot;{}&quot;, trace.report()?); Ok(()) }"></div><div id="practical-01.heading-run-the-reference-without-changing-its-inputs" data-origin-document="practical-01" data-approved-order="118" data-review-value="Run the reference without changing its inputs"></div><div id="practical-01.rust-reading-element.0187" data-origin-document="practical-01" data-approved-order="119" data-review-value="Verify the reference source, use an owned temporary checkpoint and print the scope-bearing report. rust/demos/practical-ch01-reference-core-handoff/src/main.rs#reference-example fn main() -&gt; Result&lt;(), Box&lt;dyn Error&gt;&gt; { let source = verify_compiled_reference_source()?; let checkpoint = OwnedCheckpoint::new()?; let trace = run_reference_handoff(CORPUS, SPLITS, &amp;checkpoint.file, &amp;source)?; print!(&quot;{}&quot;, trace.report()?); Ok(()) }"></div><div id="practical-01.rust-caption-element.0187" data-origin-document="practical-01" data-approved-order="120" data-review-value="Verify the reference source, use an owned temporary checkpoint and print the scope-bearing report. rust/demos/practical-ch01-reference-core-handoff/src/main.rs#reference-example"></div><div id="practical-01.rust-accessible-name-element.0187" data-origin-document="practical-01" data-approved-order="121" data-review-value="Rust source: executable fixed scalar-reference example"></div><div id="practical-01.section-keep-the-three-evidence-layers-separate" data-origin-document="practical-01" data-approved-order="122" data-review-value="Keep the three evidence layers separate&#10;The digest identifies the fixed inputs. The counts and generated token IDs describe checked behavior on those inputs. The final card keeps future quality, job-resumption and hardware claims outside the reference’s evidence boundary.&#10;A reference identity is not a capability certificate The configuration, exact corpus and split bytes, and verified scalar-reference source determine the input identity. Separate checks observe replay, fixed-window evaluation, reload and cached generation. Neither the identity nor those checks establishes useful language quality, complete job resumption or laptop throughput. Identify the fixed inputs SHA-256 identity of the fixed input record 1ec769441b5ff648137bc5c381d2416045565986272b01dacafe8ac81f48fa01 Learned scalar parameters 1188 Read the checked reference behavior Overlapping test-window target slots 1744 Within-document transition occurrences 442 Generated token IDs [260,34,34] The target slots and transition occurrences belong to the same test documents. Each transition occurrence is one adjacent pair of token positions within a document. Overlapping windows score some occurrences more than once, giving more target slots than transition occurrences. Keep unmeasured capabilities separate Not established: useful language quality, complete job resumption or laptop throughput."></div><div id="practical-01.heading-keep-the-three-evidence-layers-separate" data-origin-document="practical-01" data-approved-order="123" data-review-value="Keep the three evidence layers separate"></div><div id="practical-01.figure-reading-reference-core-handoff" data-origin-document="practical-01" data-approved-order="124" data-review-value="A reference identity is not a capability certificate The configuration, exact corpus and split bytes, and verified scalar-reference source determine the input identity. Separate checks observe replay, fixed-window evaluation, reload and cached generation. Neither the identity nor those checks establishes useful language quality, complete job resumption or laptop throughput. Identify the fixed inputs SHA-256 identity of the fixed input record 1ec769441b5ff648137bc5c381d2416045565986272b01dacafe8ac81f48fa01 Learned scalar parameters 1188 Read the checked reference behavior Overlapping test-window target slots 1744 Within-document transition occurrences 442 Generated token IDs [260,34,34] The target slots and transition occurrences belong to the same test documents. Each transition occurrence is one adjacent pair of token positions within a document. Overlapping windows score some occurrences more than once, giving more target slots than transition occurrences. Keep unmeasured capabilities separate Not established: useful language quality, complete job resumption or laptop throughput."></div><div id="practical-01.figure-name-description-reference-core-handoff" data-origin-document="practical-01" data-approved-order="125" data-review-value="A reference identity is not a capability certificate&#10;The configuration, exact corpus and split bytes, and verified scalar-reference source determine the input identity. Separate checks observe replay, fixed-window evaluation, reload and cached generation. Neither the identity nor those checks establishes useful language quality, complete job resumption or laptop throughput."></div><div id="practical-01.figure-card-element.0196" data-origin-document="practical-01" data-approved-order="126" data-review-value="Identify the fixed inputs SHA-256 identity of the fixed input record 1ec769441b5ff648137bc5c381d2416045565986272b01dacafe8ac81f48fa01 Learned scalar parameters 1188"></div><div id="practical-01.figure-contextual-heading-element.0197" data-origin-document="practical-01" data-approved-order="127" data-review-value="Identify the fixed inputs"></div><div id="practical-01.figure-card-element.0203" data-origin-document="practical-01" data-approved-order="128" data-review-value="Read the checked reference behavior Overlapping test-window target slots 1744 Within-document transition occurrences 442 Generated token IDs [260,34,34] The target slots and transition occurrences belong to the same test documents. Each transition occurrence is one adjacent pair of token positions within a document. Overlapping windows score some occurrences more than once, giving more target slots than transition occurrences."></div><div id="practical-01.figure-contextual-heading-element.0204" data-origin-document="practical-01" data-approved-order="129" data-review-value="Read the checked reference behavior"></div><div id="practical-01.figure-card-element.0212" data-origin-document="practical-01" data-approved-order="130" data-review-value="Keep unmeasured capabilities separate Not established: useful language quality, complete job resumption or laptop throughput."></div><div id="practical-01.figure-contextual-heading-element.0213" data-origin-document="practical-01" data-approved-order="131" data-review-value="Keep unmeasured capabilities separate"></div><div id="practical-01.section-optional-practice-inspect-the-boundary" data-origin-document="practical-01" data-approved-order="132" data-review-value="Optional practice: inspect the boundary&#10;From the repository root, with Docker and the Rust/site course image available, run the example and inspect its JSON report:&#10;COURSE_CORPUS=false ./course run cargo run --quiet --offline --locked -p practical-ch01-reference-core-handoff&#10;The output contains the fixed input identity and the checked scalar-reference observations described in this chapter.&#10;In the JSON report printed by the Chapter 1 reference example, find the input identity, target-count basis and metric unit. Explain why a digest alone would not replace the replay and reload checks. Run the pure identity-input mutation test. Identify its changes to configuration, corpus, split bytes and source identity without training. Explain why constructing an identity for changed inputs does not admit them to the fixed reference run. From the repository root, with Docker and the Rust/site course image available, run: COURSE_CORPUS=false ./course run cargo test --offline --locked -p practical-ch01-reference-core-handoff --test reference_handoff every_identity_input_is_bound_without_training -- --exact Expected result: one selected test passes. A zero-test result does not reproduce this check. Explain why a successful checkpoint round trip cannot justify the statement “the complete training job can resume,” and why 1744 must not be labeled “distinct test transitions.”&#10;Answers: input identity, evidence scope and repeated target slots The digest binds inputs; replay and reload compare actual behavior. Neither kind of evidence substitutes for the other. The target-count basis explicitly derives 2048 targets per schedule and 4096 for primary plus replay. The reported mean NLL uses nats per overlapping window-target slot. The pure mutation test constructs different identities without calling the pipeline. The runner separately requires the exact accepted corpus and split bytes, so an identity is not an admission permit. The checkpoint check covers persisted model, optimizer and tokenizer state plus a fixed logit probe, not every whole-job continuation dependency. The 1744 denominator counts overlapping window-target slots; the underlying documents contain 442 transition occurrences."></div><div id="practical-01.heading-optional-practice-inspect-the-boundary" data-origin-document="practical-01" data-approved-order="133" data-review-value="Optional practice: inspect the boundary"></div><div id="practical-01.answers-reading-element.0231" data-origin-document="practical-01" data-approved-order="134" data-review-value="Answers: input identity, evidence scope and repeated target slots The digest binds inputs; replay and reload compare actual behavior. Neither kind of evidence substitutes for the other. The target-count basis explicitly derives 2048 targets per schedule and 4096 for primary plus replay. The reported mean NLL uses nats per overlapping window-target slot. The pure mutation test constructs different identities without calling the pipeline. The runner separately requires the exact accepted corpus and split bytes, so an identity is not an admission permit. The checkpoint check covers persisted model, optimizer and tokenizer state plus a fixed logit probe, not every whole-job continuation dependency. The 1744 denominator counts overlapping window-target slots; the underlying documents contain 442 transition occurrences."></div><div id="practical-01.answer-disclosure-element.0232" data-origin-document="practical-01" data-approved-order="135" data-review-value="Answers: input identity, evidence scope and repeated target slots"></div><div id="practical-01.section-what-the-next-extension-must-preserve" data-origin-document="practical-01" data-approved-order="136" data-review-value="What the next extension must preserve&#10;You now have an identified scalar reference and a precisely bounded report. A later change can be compared with that reference, while carrying its own input identity and evidence. Chapter 2 uses NVIDIA NeMo Curator to prepare supplied text, then loads the prepared documents through the practical crate’s Rust reader. New data, larger models, accelerator execution, quality evaluation and complete job resumption each require their own checks; none is already established by this handoff."></div><div id="practical-01.heading-what-the-next-extension-must-preserve" data-origin-document="practical-01" data-approved-order="137" data-review-value="What the next extension must preserve"></div><div id="practical-01.chapter-navigation-reading" data-origin-document="practical-01" data-approved-order="138" data-review-value="← Previous chapter The structure of Practical LLM in Rust All chapters Next chapter → Prepare text externally, then load it in Rust"></div><div id="practical-01.chapter-navigation-group" data-origin-document="practical-01" data-approved-order="139" data-review-value="← Previous chapter The structure of Practical LLM in Rust All chapters Next chapter → Prepare text externally, then load it in Rust"></div><div id="practical-01.chapter-navigation-name" data-origin-document="practical-01" data-approved-order="140" data-review-value="Chapter navigation"></div><div id="practical-01.navigation-link-element.0248" data-origin-document="practical-01" data-approved-order="141" data-review-value="← Previous chapter The structure of Practical LLM in Rust"></div><div id="practical-01.navigation-link-element.0249" data-origin-document="p
