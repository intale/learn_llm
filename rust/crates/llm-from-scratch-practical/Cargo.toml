[package]
name = "llm-from-scratch-practical"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
config-lib = { version = "=1.1.0", default-features = false, features = ["conf", "schema"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "=0.10.9", default-features = false, features = [] }

[lints]
workspace = true
